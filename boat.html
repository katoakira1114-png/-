<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>船上注文集計（採集リクエスト連動）- 川畑水産</title>
  <meta name="description" content="船上・洋上の屋外直射日光下でも採集リクエストシートのデータを素早く確認し、ワンタップで完了更新できる洋上現場仕様Webアプリ">
  <style>
    /* ========================================================
       カラーパレット・テーマ変数
       ※標準モードと直射日光・屋外ハイコントラストモードの2系統
       ======================================================== */
    :root {
      --bg: #09131f;
      --surface: #101f33;
      --surface-card: #162842;
      --border: #1e3a5f;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #38bdf8;
      --primary-bg: #0369a1;
      --accent: #f59e0b;
      --accent-bg: rgba(245, 158, 11, 0.15);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.18);
      --danger: #ef4444;
      --highlight: #38bdf8;
      --font-scale: 1;
      --card-radius: 14px;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      --touch-min: 48px;
    }

    /* ☀️ 屋外・直射日光モード（超高コントラスト・白背景・黒枠・極太フォント） */
    body.sunlight-mode {
      --bg: #ffffff;
      --surface: #f8fafc;
      --surface-card: #ffffff;
      --border: #000000;
      --text-main: #000000;
      --text-sub: #1e293b;
      --primary: #0044cc;
      --primary-bg: #0033aa;
      --accent: #b45309;
      --accent-bg: #fef3c7;
      --success: #047857;
      --success-bg: #d1fae5;
      --danger: #b91c1c;
      --highlight: #000000;
      --shadow: 0 2px 0 #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    input, textarea, select {
      user-select: auto;
      -webkit-user-select: auto;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      padding-bottom: 95px;
      line-height: 1.4;
      min-height: 100vh;
      touch-action: manipulation;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    /* ========================================================
       固定ヘッダーエリア
       ======================================================== */
    .sticky-top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      box-shadow: var(--shadow);
    }

    body.sunlight-mode .sticky-top-bar {
      background: #ffffff;
      border-bottom: 2.5px solid #000000;
    }

    .header-main {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      font-size: 1.5rem;
      line-height: 1;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    body.sunlight-mode .brand-title {
      color: #000000;
    }

    .tag-outdoor {
      font-size: 0.7rem;
      font-weight: 800;
      background: var(--accent);
      color: #000;
      padding: 2px 6px;
      border-radius: 4px;
      vertical-align: middle;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-header-action {
      background: var(--surface-card);
      border: 1.5px solid var(--border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 40px;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    body.sunlight-mode .btn-header-action {
      border: 2px solid #000;
      color: #000;
      background: #fff;
    }

    .btn-header-action:active {
      transform: scale(0.95);
    }

    .btn-sunlight.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    body.sunlight-mode .btn-sunlight {
      background: #f59e0b;
      color: #000000;
      border-color: #000000;
    }

    /* ネットワーク状態＆最終更新時刻サブバー */
    .status-sub-bar {
      padding: 4px 14px 6px;
      font-size: 0.74rem;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-weight: 700;
    }

    body.sunlight-mode .status-sub-bar {
      color: #1e293b;
      border-top: 1px solid #e2e8f0;
      font-weight: 800;
    }

    .net-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .net-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      display: inline-block;
    }

    .net-dot.offline {
      background: var(--accent);
    }

    /* 未送信キューバナー */
    .offline-queue-bar {
      display: none;
      background: #b45309;
      color: #ffffff;
      padding: 6px 14px;
      font-size: 0.75rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f59e0b;
    }

    .offline-queue-bar.hidden {
      display: none !important;
    }

    /* ========================================================
       クイックサマリーカード（合計集計）
       ======================================================== */
    .summary-metrics-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 10px 12px;
      background: var(--bg);
    }

    .metric-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--card-radius);
      padding: 8px 10px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    body.sunlight-mode .metric-card {
      background: #ffffff;
      border: 2px solid #000000;
      box-shadow: 0 2px 0 #000000;
    }

    .metric-card.accent {
      border-color: var(--primary);
    }

    body.sunlight-mode .metric-card.accent {
      border-color: #000000;
    }

    .metric-label {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--text-sub);
      margin-bottom: 2px;
    }

    body.sunlight-mode .metric-label {
      color: #000000;
      font-weight: 900;
    }

    .metric-value {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--text-main);
      line-height: 1.1;
    }

    body.sunlight-mode .metric-value {
      color: #000000;
    }

    .metric-value.accent {
      color: var(--primary);
    }

    body.sunlight-mode .metric-value.accent {
      color: #000000;
    }

    .metric-unit {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-left: 2px;
    }

    body.sunlight-mode .metric-unit {
      color: #334155;
    }

    /* ========================================================
       タブ切り替え＆コントロールエリア
       ======================================================== */
    .control-panel {
      padding: 0 12px 10px;
      background: var(--bg);
    }

    .view-tabs-container {
      display: flex;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 4px;
      margin-bottom: 10px;
    }

    body.sunlight-mode .view-tabs-container {
      background: #e2e8f0;
      border-color: #000000;
    }

    .view-tab-btn {
      flex: 1;
      padding: 10px 8px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 0.92rem;
      font-weight: 900;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      touch-action: manipulation;
      min-height: var(--touch-min);
      transition: all 0.15s ease;
    }

    .view-tab-btn.active {
      background: var(--primary-bg);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    body.sunlight-mode .view-tab-btn {
      color: #334155;
    }

    body.sunlight-mode .view-tab-btn.active {
      background: #000000;
      color: #ffffff;
    }

    /* 検索バー */
    .search-row {
      position: relative;
      margin-bottom: 8px;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      pointer-events: none;
      color: var(--text-sub);
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 2px solid var(--border);
      color: var(--text-main);
      padding: 12px 40px 12px 38px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      outline: none;
      transition: border-color 0.15s ease;
    }

    body.sunlight-mode .search-input {
      border-color: #000;
      color: #000;
      background: #fff;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .search-clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--surface-card);
      border: 1px solid var(--border);
      color: var(--text-sub);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 900;
      font-size: 0.85rem;
      display: none;
    }

    .search-clear-btn.visible {
      display: flex;
    }

    /* フィルタ＆ソートツールバー */
    .sub-tools-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .filter-chips-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      flex: 1;
    }

    .filter-chips-row::-webkit-scrollbar {
      display: none;
    }

    .chip-btn {
      padding: 6px 12px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text-sub);
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
    }

    .chip-btn.active {
      background: var(--surface-card);
      color: var(--text-main);
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }

    body.sunlight-mode .chip-btn {
      border-color: #000;
      color: #000;
      background: #ffffff;
    }

    body.sunlight-mode .chip-btn.active {
      background: #000;
      color: #fff;
    }

    .tool-btn {
      padding: 6px 10px;
      background: var(--surface-card);
      border: 1.5px solid var(--border);
      color: var(--text-main);
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      touch-action: manipulation;
      shrink: 0;
    }

    body.sunlight-mode .tool-btn {
      border-color: #000;
      color: #000;
      background: #fff;
    }

    .tool-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    body.sunlight-mode .tool-btn.active {
      background: #f59e0b;
      color: #000;
      border-color: #000;
    }

    /* ========================================================
       メインコンテンツ・カードリスト
       ======================================================== */
    .main-container {
      padding: 0 12px;
    }

    /* 空状態メッセージ */
    .empty-state {
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: var(--card-radius);
      padding: 40px 20px;
      text-align: center;
      color: var(--text-sub);
      margin-top: 10px;
    }

    body.sunlight-mode .empty-state {
      background: #ffffff;
      border-color: #000000;
      color: #000000;
    }

    .empty-state-icon {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }

    .empty-state-title {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    body.sunlight-mode .empty-state-title {
      color: #000000;
    }

    /* --------------------------------------------------------
       1. 【商品（生体）別カードスタイル】
       -------------------------------------------------------- */
    .product-group-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--card-radius);
      margin-bottom: 10px;
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: all 0.15s ease;
    }

    body.sunlight-mode .product-group-card {
      border: 2.5px solid #000000;
      background: #ffffff;
      box-shadow: 0 3px 0 #000000;
    }

    .product-group-card.completed {
      opacity: 0.65;
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.05);
    }

    body.sunlight-mode .product-group-card.completed {
      opacity: 0.88;
      background: #f0fdf4;
      border-color: #047857;
    }

    .product-card-header {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .prod-main-info {
      flex: 1;
      min-width: 0;
    }

    .prod-category-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--primary);
      background: rgba(56, 189, 248, 0.15);
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    body.sunlight-mode .prod-category-tag {
      background: #e2e8f0;
      color: #000;
      border: 1px solid #000;
    }

    .prod-name {
      font-size: 1.18rem;
      font-weight: 900;
      color: var(--text-main);
      word-break: break-word;
      line-height: 1.25;
    }

    body.sunlight-mode .prod-name {
      color: #000000;
    }

    .product-group-card.completed .prod-name {
      text-decoration: line-through;
      color: var(--text-sub);
    }

    .prod-sub-meta {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    body.sunlight-mode .prod-sub-meta {
      color: #334155;
      font-weight: 800;
    }

    /* 合計数量の特大バッジ */
    .prod-total-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      text-align: right;
      padding-left: 8px;
      shrink: 0;
    }

    .prod-total-count {
      font-size: 1.85rem;
      font-weight: 900;
      color: var(--primary);
      line-height: 1;
      display: flex;
      align-items: baseline;
      gap: 2px;
    }

    body.sunlight-mode .prod-total-count {
      color: #000;
    }

    .product-group-card.completed .prod-total-count {
      color: var(--text-sub);
    }

    .prod-total-unit {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-sub);
    }

    body.sunlight-mode .prod-total-unit {
      color: #000;
    }

    .expand-chevron {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 4px;
      transition: transform 0.2s ease;
    }

    .product-group-card.expanded .expand-chevron {
      transform: rotate(180deg);
      color: var(--primary);
    }

    /* アコーディオン展開：店舗内訳詳細リスト */
    .product-breakdown-drawer {
      display: none;
      background: rgba(0, 0, 0, 0.25);
      border-top: 1.5px dashed var(--border);
      padding: 10px 14px;
    }

    body.sunlight-mode .product-breakdown-drawer {
      background: #f8fafc;
      border-top: 2px dashed #000;
    }

    .product-group-card.expanded .product-breakdown-drawer {
      display: block;
    }

    .breakdown-header-title {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-sub);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    body.sunlight-mode .breakdown-header-title {
      color: #000;
    }

    .breakdown-store-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--surface-card);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      margin-bottom: 7px;
      gap: 8px;
    }

    body.sunlight-mode .breakdown-store-row {
      background: #ffffff;
      border: 2px solid #000;
    }

    .breakdown-store-row.completed {
      opacity: 0.6;
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.08);
    }

    body.sunlight-mode .breakdown-store-row.completed {
      background: #f0fdf4;
      border-color: #047857;
      opacity: 0.9;
    }

    .breakdown-store-row:last-child {
      margin-bottom: 0;
    }

    .breakdown-store-info {
      flex: 1;
      min-width: 0;
    }

    .breakdown-store-name {
      font-weight: 900;
      font-size: 0.95rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    body.sunlight-mode .breakdown-store-name {
      color: #000;
    }

    .breakdown-store-row.completed .breakdown-store-name {
      text-decoration: line-through;
    }

    .breakdown-store-meta {
      font-size: 0.76rem;
      color: var(--text-sub);
      margin-top: 2px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-weight: 700;
    }

    body.sunlight-mode .breakdown-store-meta {
      color: #334155;
    }

    /* 個別採集完了ボタン */
    .btn-item-toggle {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 900;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: var(--primary-bg);
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
      white-space: nowrap;
      min-height: 40px;
      transition: all 0.15s ease;
    }

    body.sunlight-mode .btn-item-toggle {
      border: 2px solid #000;
      background: #0044cc;
      color: #fff;
    }

    .btn-item-toggle.done {
      background: var(--success);
      border-color: var(--success);
    }

    body.sunlight-mode .btn-item-toggle.done {
      background: #047857;
      border-color: #000;
    }

    /* --------------------------------------------------------
       2. 【店舗別カードスタイル】
       -------------------------------------------------------- */
    .store-order-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--card-radius);
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      padding: 14px;
      transition: all 0.15s ease;
    }

    body.sunlight-mode .store-order-card {
      border: 2.5px solid #000000;
      background: #ffffff;
      box-shadow: 0 3px 0 #000000;
    }

    .store-order-card.completed {
      opacity: 0.65;
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.05);
    }

    body.sunlight-mode .store-order-card.completed {
      opacity: 0.9;
      background: #f0fdf4;
      border-color: #047857;
    }

    .store-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1.5px solid var(--border);
    }

    body.sunlight-mode .store-header-row {
      border-bottom: 2px solid #000;
    }

    .store-main-title {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
      word-break: break-word;
    }

    body.sunlight-mode .store-main-title {
      color: #000;
    }

    .store-order-card.completed .store-main-title {
      text-decoration: line-through;
    }

    .store-meta-line {
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-weight: 700;
    }

    body.sunlight-mode .store-meta-line {
      color: #334155;
    }

    .store-phone-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    body.sunlight-mode .store-phone-link {
      color: #0044cc;
      text-decoration: underline;
    }

</head>
<body>

  <!-- ========================================================
       固定ヘッダーエリア
       ======================================================== -->
  <div class="sticky-top-bar">
    <div class="header-main">
      <div class="brand-box">
        <span class="brand-icon">🎣</span>
        <div>
          <div class="brand-title">
            船上注文集計

      </div>
      <div class="header-actions">
        <!-- ☀️ 直射日光・高コントラスト切替ボタン -->
        <button type="button" class="btn-header-action btn-sunlight" id="sunlight-btn" onclick="toggleSunlightMode()" title="直射日光・屋外高コントラスト表示切替">

      <button onclick="processSyncQueue()" style="background:rgba(0,0,0,0.3); color:#fff; border:none; padding:2px 8px; border-radius:4px; font-weight:bold; cursor:pointer;">今すぐ再送</button>

  <!-- ========================================================

    <div class="metric-card">

        <span id="sort-icon">⬇</span>
        <span id="sort-label">多い順</span>

      </button>

  <!-- ========================================================
       メインコンテンツエリア
       ======================================================== -->
  <main class="main-container">
    <!-- ビュー1：【商品（生体）別集計リスト】 -->
    <div id="view-product">
      <div id="product-list-container">
        <!-- JS動的レンダリング -->
      </div>
    </div>

    <!-- ビュー2：【店舗別集計リスト】 -->
    <div id="view-store" style="display: none;">
      <div id="store-list-container">
        <!-- JS動的レンダリング -->
      </div>
    </div>
  </main>

  <!-- ========================================================
       固定ボトムバー
       ======================================================== -->
  <div class="fixed-bottom-bar">
    <div class="bottom-tab-switch">
      <button type="button" class="bottom-tab-btn active" id="bottom-tab-prod" onclick="switchView('product')">
        🐟 魚種別
      </button>
      <button type="button" class="bottom-tab-btn" id="bottom-tab-store" onclick="switchView('store')">
        🏢 店舗別
      </button>
    </div>
    <button type="button" class="bottom-action-btn" onclick="window.scrollTo({top:0, behavior:'smooth'})">
      ⬆ 上部
    </button>
    <button type="button" class="bottom-action-btn" onclick="resetAllStatusForTest()" style="color:#f87171; border-color:#991b1b;" title="検証用：全件を未対応に戻す">
      🔄 リセット
    </button>
  </div>

  <!-- トースト通知 -->
  <div class="toast-msg" id="toast-msg"></div>

  <!-- ========================================================
       JavaScript アプリケーションロジック
       ======================================================== -->
  <script>
    // ==========================================
    // 1. 環境設定・GAS APIエンドポイント
    // ==========================================
    // ※スプレッドシート「採集リクエスト一覧」と連携するGAS Web App
    const API_URL = "https://script.google.com/macros/s/AKfycbxIYsPdreUjaOFutfshhQIwOLb_Ke1JprcDZj_LAT9oZnc-l-3jZLsPAsFd_QdQJAQ4eA/exec";

    // ローカルストレージキー
    const STORAGE_KEY_REQUESTS = "kawabata_boat_requests_data_v3";
    const STORAGE_KEY_QUEUE = "kawabata_boat_sync_queue_v3";
    const STORAGE_KEY_SUNLIGHT = "kawabata_boat_sunlight_mode";
    const STORAGE_KEY_DATASOURCE = "kawabata_boat_datasource_mode_v3"; // 'live' or 'mock'
    const STORAGE_KEY_SHOW_COMPLETED = "kawabata_boat_show_completed";
    const STORAGE_KEY_LAST_SYNC = "kawabata_boat_last_sync_time";

    // ==========================================
    // 2. 実シートに基づく動作確認用初期モックデータ（採集リクエスト仕様）
    // ==========================================
    const DEFAULT_MOCK_REQUESTS = [
      {
        id: "REQ-20261005-035408-1",
        requestId: "REQ-20261005-035408",
        rowNumber: 2,
        date: "10/05 03:54",
        storeName: "加藤晃",
        phone: "090-9971-9013",
        species: "スカシテンジク",
        category: "海水魚",
        size: "3-4cm",
        qty: 50,
        unit: "匹",
        status: "新規受付",
        notes: ""
      },
      {
        id: "REQ-20261005-035408-2",
        requestId: "REQ-20261005-035408",
        rowNumber: 2,
        date: "10/05 03:54",
        storeName: "加藤晃",
        phone: "090-9971-9013",
        species: "ネオンテンジク",
        category: "海水魚",
        size: "5-7cm",
        qty: 100,
        unit: "匹",
        status: "新規受付",
        notes: ""
      },
      {
        id: "REQ-20261005-035408-3",
        requestId: "REQ-20261005-035408",
        rowNumber: 2,
        date: "10/05 03:54",
        storeName: "加藤晃",
        phone: "090-9971-9013",
        species: "ウミキノコ",
        category: "ソフトコーラル",
        size: "小さめ",
        qty: 20,
        unit: "匹",
        status: "新規受付",
        notes: ""
      },
      {
        id: "REQ-20261005-040858-1",
        requestId: "REQ-20261005-040858",
        rowNumber: 3,
        date: "10/05 04:08",
        storeName: "加藤晃",
        phone: "090-9971-9013",
        species: "スカシテンジクダイ",
        category: "海水魚",
        size: "規格未指定",
        qty: 1,
        unit: "匹",
        status: "新規受付",
        notes: ""
      },
      {
        id: "REQ-20261005-043412-1",
        requestId: "REQ-20261005-043412",
        rowNumber: 4,
        date: "10/05 04:34",
        storeName: "加藤晃",
        phone: "090-9971-9013",
        species: "ネオンテンジク",
        category: "海水魚",
        size: "規格未指定",
        qty: 1,
        unit: "匹",
        status: "新規受付",
        notes: ""
      }
    ];

    // ==========================================
    // 3. アプリケーション状態変数
    // ==========================================
    let requestsData = [];
    let currentView = 'product'; // 'product' or 'store'
    let isSunlightMode = false;
    let dataSource = 'live'; // デフォルトは本番スプレッドシート連動
    let showCompleted = false; // 完了済みも含めるか
    let searchQuery = '';
    let selectedCategoryFilter = 'all';
    let currentSortOrder = 'count_desc'; // 'count_desc' or 'name_asc'
    let expandedProductMap = new Set(); // 展開中の商品名（正規化キー）

    // ==========================================
    // 4. 生体名正規化エンジン（表記揺れの吸収）
    // ==========================================
    function normalizeSpeciesName(name) {
      if (!name) return "未指定生体";
      let n = name.trim();
      // スカシテンジクダイ ⇄ スカシテンジク
      if (n === "スカシテンジクダイ" || n === "スカシテンジク") return "スカシテンジク";
      // ネオンテンジクダイ ⇄ ネオンテンジク
      if (n === "ネオンテンジクダイ" || n === "ネオンテンジク") return "ネオンテンジク";
      // ヒメシャコ ⇄ ヒメシャコガイ
      if (n === "ヒメシャコ") return "ヒメシャコガイ";
      // マンジュウイシモチ
      if (n === "マンジュウイシモチ" || n === "マンジュウ") return "マンジュウイシモチ";
      return n;
    }

    // ==========================================
    // 5. 初期化ライフサイクル
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      // 1. 直射日光モード復元
      try {
        isSunlightMode = localStorage.getItem(STORAGE_KEY_SUNLIGHT) === 'true';
        if (isSunlightMode) {
          document.body.classList.add('sunlight-mode');
          updateSunlightButtonUI(true);
        }
      } catch (e) {}

      // 2. データソースモード復元（デフォルト本番live）
      try {
        dataSource = localStorage.getItem(STORAGE_KEY_DATASOURCE) || 'live';
      } catch (e) {}
      updateDataSourceUI();

      // 3. 完了表示フラグ復元
      try {
        showCompleted = localStorage.getItem(STORAGE_KEY_SHOW_COMPLETED) === 'true';
        updateCompletedFilterUI();
      } catch (e) {}

      // 4. キャッシュデータ読み込み
      loadRequestsFromCache();

      // 5. ネットワーク監視＆オフライン送信キュー
      setupNetworkMonitor();
      updateQueueBanner();

      // 6. UI描画
      renderCategoryChips();
      renderAll();

      // 最終更新表示
      const lastSync = localStorage.getItem(STORAGE_KEY_LAST_SYNC);
      if (lastSync) {
        document.getElementById('last-updated-text').innerText = `最終更新: ${lastSync}`;
      }

      // 本番モードかつオンラインなら自動で最新スプレッドシート取得
      if (dataSource === 'live' && navigator.onLine) {
        fetchRequests(true);
      }
    });

    // ==========================================
    // 6. キャッシュ＆ローカルストレージ管理
    // ==========================================
    function loadRequestsFromCache() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_REQUESTS);
        if (raw) {
          requestsData = JSON.parse(raw);
        } else {
          requestsData = JSON.parse(JSON.stringify(DEFAULT_MOCK_REQUESTS));
          saveRequestsToCache();
        }
      } catch (e) {
        requestsData = JSON.parse(JSON.stringify(DEFAULT_MOCK_REQUESTS));
      }
    }

    function saveRequestsToCache() {
      try {
        localStorage.setItem(STORAGE_KEY_REQUESTS, JSON.stringify(requestsData));
      } catch (e) {
        console.warn('Failed to save requests to cache:', e);
      }
    }

    function updateLastSyncTime() {
      const now = new Date();
      const timeStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      localStorage.setItem(STORAGE_KEY_LAST_SYNC, timeStr);
      document.getElementById('last-updated-text').innerText = `最終更新: ${timeStr}`;
    }

    // ==========================================
    // 7. オフライン＆ネットワーク監視ロジック
    // ==========================================
    function setupNetworkMonitor() {
      const netDot = document.getElementById('net-dot');
      const netText = document.getElementById('net-text');

      function updateStatus() {
        if (navigator.onLine) {
          netDot.className = 'net-dot';
          netText.innerText = 'オンライン';
          processSyncQueue();
        } else {
          netDot.className = 'net-dot offline';
          netText.innerText = 'オフライン(圏外キャッシュ)';
          showToast('📡 電波圏外：保存済みキャッシュで作業継続できます');
        }
      }

      window.addEventListener('online', updateStatus);
      window.addEventListener('offline', updateStatus);
      updateStatus();
    }

    function getSyncQueue() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY_QUEUE) || '[]');
      } catch (e) {
        return [];
      }
    }

    function addToSyncQueue(item) {
      const queue = getSyncQueue();
      const filtered = queue.filter(q => q.id !== item.id);
      filtered.push(item);
      localStorage.setItem(STORAGE_KEY_QUEUE, JSON.stringify(filtered));
      updateQueueBanner();
    }

    function updateQueueBanner() {
      const banner = document.getElementById('offline-queue-banner');
      const text = document.getElementById('offline-queue-text');
      const queue = getSyncQueue();
      if (queue.length > 0) {
        banner.classList.remove('hidden');
        text.innerText = `⚠️ 未送信の更新: ${queue.length}件（電波復帰時に自動送信）`;
      } else {
        banner.classList.add('hidden');
      }
    }

    async function processSyncQueue() {
      if (!navigator.onLine || dataSource === 'mock') return;
      const queue = getSyncQueue();
      if (queue.length === 0) return;

      console.log(`[SyncQueue] 未送信キュー ${queue.length}件を同期開始...`);
      showToast(`🔄 電波復帰：未送信 ${queue.length}件をGASへ送信中...`);

      const remaining = [];
      for (const item of queue) {
        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'updateRequestStatus',
              id: item.id,
              requestId: item.requestId,
              rowNumber: item.rowNumber,
              status: item.status,
              updatedAt: item.timestamp
            })
          });
          const result = await res.json();
          if (result.status !== 'success' && result.status !== 'not_found') {
            remaining.push(item);
          }
        } catch (err) {
          remaining.push(item);
        }
      }

      localStorage.setItem(STORAGE_KEY_QUEUE, JSON.stringify(remaining));
      updateQueueBanner();

      if (remaining.length === 0) {
        showToast('✅ 全てのステータス更新をスプレッドシートへ同期完了！');
      } else {
        showToast(`一部の送信が保留されました (残り ${remaining.length}件)`);
      }
    }

    // ==========================================
    // 8. データ取得処理（採集リクエストシート連携）
    // ==========================================
    async function fetchRequests(silent = false) {
      const refreshIcon = document.getElementById('refresh-icon');
      refreshIcon.classList.add('spin');

      if (dataSource === 'mock') {
        setTimeout(() => {
          refreshIcon.classList.remove('spin');
          updateLastSyncTime();
          renderAll();
          if (!silent) showToast('モックデータを再読み込みしました', '🧪');
        }, 400);
        return;
      }

      if (!navigator.onLine) {
        refreshIcon.classList.remove('spin');
        showToast('📡 電波が圏外です。キャッシュデータを表示しています');
        return;
      }

      try {
        const res = await fetch(`${API_URL}?action=getSpecimenRequests&timestamp=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        if (data && data.requests && Array.isArray(data.requests)) {
          // 未送信キューの状態を保持して上書き防止
          const queue = getSyncQueue();
          const queuedMap = new Map(queue.map(q => [q.id, q.status]));

          requestsData = data.requests.map((item, idx) => ({
            id: item.id || `REQ-${item.requestId || idx}-${idx}`,
            requestId: item.requestId || '',
            rowNumber: item.rowNumber || 0,
            date: item.date || '本日',
            storeName: item.storeName || item.customerName || '名称未設定店',
            phone: item.phone ? String(item.phone).replace(/^\*/, '') : '',
            species: item.species || item.name || '生体',
            category: item.category || '海水魚',
            size: item.size || '規格なし',
            qty: Number(item.qty || item.quantity) || 1,
            unit: item.unit || '匹',
            status: queuedMap.has(item.id) ? queuedMap.get(item.id) : (item.status || '新規受付'),
            notes: item.notes || ''
          }));

          saveRequestsToCache();
          updateLastSyncTime();
          renderCategoryChips();
          renderAll();
          if (!silent) showToast(`✅ 採集リクエストシートから${requestsData.length}件を受信しました`);
        } else {
          if (!silent) showToast('データ形式が異なります。キャッシュを表示します');
        }
      } catch (err) {
        console.warn('Live fetch error:', err);
        if (!silent) showToast('⚠️ 取得エラー。保存済みキャッシュを表示中');
      } finally {
        refreshIcon.classList.remove('spin');
      }
    }

    // ==========================================
    // 9. ワンタップステータス更新処理（楽観的UI）
    // ==========================================
    async function toggleItemStatus(itemId) {
      const target = requestsData.find(r => r.id === itemId);
      if (!target) return;

      const prevStatus = target.status;
      const newStatus = (prevStatus === '採集完了') ? '新規受付' : '採集完了';
      target.status = newStatus;

      // 1. 【楽観的UI更新】待ち時間0msで即時画面更新
      saveRequestsToCache();
      renderAll();

      // 触覚フィードバック（波揺れでも手応えを実感）
      if (navigator.vibrate) {
        navigator.vibrate(newStatus === '採集完了' ? [25, 40, 25] : 15);
      }

      if (newStatus === '採集完了') {
        showToast(`🐟「${target.species}」を採集完了にしました！`);
      } else {
        showToast(`↩️「${target.species}」を未対応に戻しました`);
      }

      if (dataSource === 'mock') return;

      // 2. GAS Web APIへPOST同期
      const payload = {
        id: target.id,
        requestId: target.requestId,
        rowNumber: target.rowNumber,
        species: target.species,
        status: newStatus,
        timestamp: new Date().toISOString()
      };

      if (!navigator.onLine) {
        addToSyncQueue(payload);
        return;
      }

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'updateRequestStatus',
            ...payload
          })
        });
        const result = await res.json();
        if (result.status !== 'success' && result.status !== 'not_found') {
          throw new Error(result.message || '更新エラー');
        }
      } catch (err) {
        console.warn('[Sync Failed] オフラインキューに退避:', err);
        addToSyncQueue(payload);
      }
    }

    // 店舗全体の全生体を一括「採集完了」または「未完了に戻す」
    async function toggleStoreAllStatus(storeName) {
      const storeItems = requestsData.filter(r => r.storeName === storeName);
      if (storeItems.length === 0) return;

      const allCompleted = storeItems.every(r => r.status === '採集完了');
      const targetNewStatus = allCompleted ? '新規受付' : '採集完了';

      storeItems.forEach(it => {
        it.status = targetNewStatus;
      });

      saveRequestsToCache();
      renderAll();

      if (navigator.vibrate) navigator.vibrate(targetNewStatus === '採集完了' ? [30, 50, 30] : 20);
      showToast(targetNewStatus === '採集完了' ? `🏢「${storeName}」の全生体を採集完了にしました` : `↩️「${storeName}」を未対応に戻しました`);

      if (dataSource === 'mock') return;

      // 各アイテムのステータス更新をPOSTまたはキューに格納
      storeItems.forEach(it => {
        const payload = {
          id: it.id,
          requestId: it.requestId,
          rowNumber: it.rowNumber,
          species: it.species,
          status: targetNewStatus,
          timestamp: new Date().toISOString()
        };
        if (!navigator.onLine) {
          addToSyncQueue(payload);
        } else {
          fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'updateRequestStatus',
              ...payload
            })
          }).catch(err => {
            addToSyncQueue(payload);
          });
        }
      });
    }

    // ==========================================
    // 10. 集計ロジック（商品別・店舗別）
    // ==========================================
    /**
     * 商品（魚種）別集計リストの生成
     */
    function aggregateProducts() {
      const map = {};

      const activeItems = requestsData.filter(item => {
        if (!showCompleted && item.status === '採集完了') return false;
        return true;
      });

      activeItems.forEach(item => {
        const normKey = normalizeSpeciesName(item.species);
        if (!map[normKey]) {
          map[normKey] = {
            name: normKey,
            originalNames: new Set([item.species]),
            category: item.category || '海水魚',
            unit: item.unit || '匹',
            totalQty: 0,
            unhandledQty: 0,
            breakdown: []
          };
        } else {
          map[normKey].originalNames.add(item.species);
        }

        const isDone = (item.status === '採集完了');
        map[normKey].totalQty += item.qty;
        if (!isDone) {
          map[normKey].unhandledQty += item.qty;
        }

        map[normKey].breakdown.push({
          id: item.id,
          requestId: item.requestId,
          rowNumber: item.rowNumber,
          customerName: item.storeName,
          phone: item.phone,
          species: item.species,
          size: item.size,
          qty: item.qty,
          unit: item.unit,
          date: item.date,
          notes: item.notes,
          isCompleted: isDone
        });
      });

      let list = Object.values(map);

      // カテゴリ絞り込み
      if (selectedCategoryFilter !== 'all') {
        list = list.filter(p => p.category === selectedCategoryFilter);
      }

      // 検索ワード絞り込み
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        list = list.filter(p => {
          return p.name.toLowerCase().includes(q) ||
                 Array.from(p.originalNames).some(on => on.toLowerCase().includes(q)) ||
                 p.category.toLowerCase().includes(q) ||
                 p.breakdown.some(b => 
                   b.customerName.toLowerCase().includes(q) ||
                   b.size.toLowerCase().includes(q) ||
                   b.species.toLowerCase().includes(q) ||
                   (b.notes && b.notes.toLowerCase().includes(q))
                 );
        });
      }

      // ソート
      if (currentSortOrder === 'count_desc') {
        list.sort((a, b) => (b.unhandledQty - a.unhandledQty) || (b.totalQty - a.totalQty));
      } else {
        list.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
      }

      return list;
    }

    /**
     * 店舗別リクエスト集計リストの生成
     */
    function aggregateStores() {
      const map = {};

      requestsData.forEach(item => {
        const sName = item.storeName || '名称未設定店';
        if (!map[sName]) {
          map[sName] = {
            storeName: sName,
            phone: item.phone,
            date: item.date,
            items: []
          };
        }
        if (!map[sName].phone && item.phone) map[sName].phone = item.phone;
        map[sName].items.push(item);
      });

      let list = Object.values(map);

      // 店舗ごとの完了判定
      list.forEach(store => {
        store.totalQty = store.items.reduce((sum, it) => sum + it.qty, 0);
        store.unhandledQty = store.items.filter(it => it.status !== '採集完了').reduce((sum, it) => sum + it.qty, 0);
        store.isAllCompleted = (store.unhandledQty === 0 && store.items.length > 0);
      });

      // 完了済みフィルタ
      if (!showCompleted) {
        list = list.filter(s => !s.isAllCompleted);
      }

      // カテゴリ絞り込み
      if (selectedCategoryFilter !== 'all') {
        list = list.filter(s => s.items.some(it => it.category === selectedCategoryFilter));
      }

      // 検索ワード絞り込み
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        list = list.filter(s => {
          return s.storeName.toLowerCase().includes(q) ||
                 (s.phone && s.phone.includes(q)) ||
                 s.items.some(it => 
                   it.species.toLowerCase().includes(q) ||
                   it.size.toLowerCase().includes(q) ||
                   (it.notes && it.notes.toLowerCase().includes(q))
                 );
        });
      }

      // 未対応匹数が多い店舗順にソート
      list.sort((a, b) => (b.unhandledQty - a.unhandledQty) || (b.totalQty - a.totalQty));

      return list;
    }

    // ==========================================
    // 13. サマリーメトリクス計算
    // ==========================================
    function updateMetrics() {
      let unhandledQty = 0;
      const unhandledSpeciesSet = new Set();
      const unhandledStoresSet = new Set();

      requestsData.forEach(r => {
        if (r.status !== '採集完了') {
          unhandledStoresSet.add(r.storeName);
          unhandledQty += r.qty;
          unhandledSpeciesSet.add(normalizeSpeciesName(r.species));
        }
      });

      document.getElementById('metric-unhandled-products').innerHTML = `${unhandledSpeciesSet.size}<span class="metric-unit">品</span>`;
      document.getElementById('metric-unhandled-qty').innerHTML = `${unhandledQty}<span class="metric-unit">匹</span>`;
      document.getElementById('metric-unhandled-stores').innerHTML = `${unhandledStoresSet.size}<span class="metric-unit">店</span>`;
    }

    // 14. フィルターチップス描画
    // ==========================================

      localStorage.setItem(STORAGE_KEY_SUNLIGHT, String(isSunlightMode));
      updateSunlightButtonUI(isSunlightMode);
      showToast(isSunlightMode ? '☀️ 屋外・直射日光モードをONにしました' : '🌙 標準モードに戻しました');
      if (navigator.vibrate) navigator.vibrate(20);
    }

    function updateSunlightButtonUI(isSun) {
      const btn = document.getElementById('sunlight-btn');
      const icon = document.getElementById('sunlight-icon');
      const label = document.getElementById('sunlight-label');
      if (isSun) {
        btn.classList.add('active');
        icon.innerText = '🌙';
        label.innerText = '標準モード';
      } else {
        btn.classList.remove('active');
        icon.innerText = '☀️';
        label.innerText = '屋外モード';
      }
    }

    // ==========================================
    // 17. 検索入力ハンドラ
    // ==========================================
    function handleSearchInput() {
      const input = document.getElementById('search-input');
      const clearBtn = document.getElementById('search-clear-btn');
      searchQuery = input.value.trim();
      clearBtn.classList.toggle('visible', searchQuery.length > 0);
      renderAll();
    }

    function clearSearch() {
      const input = document.getElementById('search-input');
      input.value = '';
      searchQuery = '';
      document.getElementById('search-clear-btn').classList.remove('visible');
      renderAll();
      input.focus();
    }

    // ==========================================
    // 18. データソース切り替え（モック ⇄ 本番GAS）
    // ==========================================
    function toggleDataSourceModal() {
      if (dataSource === 'mock') {
        if (confirm('【データソースの切り替え】\n現在「動作確認用モックデータ」を表示しています。\n本番のGoogleスプレッドシート（採集リクエストシート）と接続しますか？')) {
          dataSource = 'live';
          localStorage.setItem(STORAGE_KEY_DATASOURCE, 'live');
          updateDataSourceUI();
          fetchRequests(false);
        }
      } else {
        if (confirm('【データソースの切り替え】\n本番接続から「動作確認用モックデータ」に戻しますか？')) {
          dataSource = 'mock';
          localStorage.setItem(STORAGE_KEY_DATASOURCE, 'mock');
          requestsData = JSON.parse(JSON.stringify(DEFAULT_MOCK_REQUESTS));
          saveRequestsToCache();
          updateDataSourceUI();
          renderCategoryChips();
          renderAll();
          showToast('モックデータモードに切り替えました');
        }
      }
    }

    function updateDataSourceUI() {
      const pill = document.getElementById('data-source-pill');
      if (dataSource === 'live') {
        pill.innerText = '🌐 本番シート連動中';
        pill.style.color = 'var(--success)';
      } else {
        pill.innerText = '🧪 モックデータ中';
        pill.style.color = 'var(--accent)';
      }
    }

    // ==========================================
    // 19. 全件再描画
    // ==========================================
    function renderAll() {
      updateMetrics();
      if (currentView === 'product') {
        renderProductView();
      } else {
        renderStoreView();
      }
    }

    function resetAllStatusForTest() {
      if (confirm('すべてのリクエストのステータスを「新規受付（未完了）」にリセットしますか？')) {
        requestsData.forEach(r => {
          r.status = '新規受付';
        });
        saveRequestsToCache();
        renderAll();
        showToast('全てのステータスを未対応にリセットしました');
      }
    }

    // ==========================================
    // 20. ユーティリティ
    // ==========================================
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast-msg');
      el.innerText = msg;
      el.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.remove('show');
      }, 2500);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeJs(str) {
      if (!str) return '';
      return String(str).replace(/'/g, "\\'").replace(/"/g, '\\"');
    }
  </script>
</body>
</html>
