<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品注文フォーム - 川畑水産</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; background: #f4f6f9; }
    .debug-box { background: #333; color: #00ff00; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; word-break: break-all; margin-bottom: 20px; }
    .status-ok { background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; }
    .status-ng { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; }
    button { padding: 10px 15px; font-size: 14px; margin-top: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>🔍 アカウント連携 診断画面</h2>

  <div id="status-box" class="status-ng">診断中...</div>

  <div class="debug-box" id="debug-log">ログ取得中...</div>

  <button onclick="location.reload(true)">🔄 再読み込み（キャッシュクリア）</button>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwEEEt2vWPC4BXlnj08pxvW6ARGKX4FVz41anHlh9wWaXmdduhz4Bb7YQsskkGHMwRz-A/exec";
    const LIFF_ID = "2011653892-RjIQ6YBe";

    const logEl = document.getElementById('debug-log');
    const statusEl = document.getElementById('status-box');

    function log(msg) {
      logEl.innerHTML += msg + "<br>";
      console.log(msg);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      log("1. 開始: LIFF初期化中...");
      
      let userId = "取得失敗";
      let displayName = "未取得";

      try {
        await liff.init({ liffId: LIFF_ID });
        log("2. LIFF初期化成功");

        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          userId = profile.userId;
          displayName = profile.displayName;
          log("3. LINEログイン確認済: " + displayName);
          log("👉 取得した【実際のLINE UserID】:<br><b style='color:#ffff00; font-size:15px;'>" + userId + "</b>");
        } else {
          log("⚠️ LINE未ログイン状態です。ログイン画面へ遷移します...");
          liff.login();
          return;
        }
      } catch (err) {
        log("❌ LIFFエラー: " + err.message);
      }

      log("<br>4. GASへ顧客データ照会中... (送信UserID: " + userId + ")");

      try {
        const res = await fetch(GAS_API_URL + "?userId=" + encodeURIComponent(userId));
        const data = await res.json();
        
        log("<br>5. GASからの応答結果:");
        log("・isRegistered (登録判定): <b style='color:#ffff00;'>" + data.isRegistered + "</b>");
        log("・商品取得件数: " + (data.products ? data.products.length : 0) + " 件");

        if (data.isRegistered) {
          statusEl.className = "status-ok";
          statusEl.innerHTML = "🎉 登録確認成功！<br>店舗名: " + data.customer.name + "<br>掛率: " + (data.customer.discountRate * 100) + "%";
          log("・顧客マスタ取得データ: " + JSON.stringify(data.customer));
        } else {
          statusEl.className = "status-ng";
          statusEl.innerHTML = "❌ 未登録と判定されました。<br>スプレッドシートのIDと、上記黄色文字のUserIDが一致しているか確認してください。";
        }

      } catch (gasErr) {
        log("❌ GAS通信エラー: " + gasErr.message);
        statusEl.className = "status-ng";
        statusEl.innerText = "GASとの通信に失敗しました。";
      }
    });
  </script>
</body>
</html>
