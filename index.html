<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>石垣島観賞魚便商品一覧</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; color: #333; padding-bottom: 90px; }
    
    /* 上部固定エリア */
    .header-bar { position: sticky; top: 0; z-index: 100; background: #fff; padding: 10px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-bottom: 1px solid #e0e0e0; }
    .header-title { font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 8px; color: #1a252c; }
    
    /* カテゴリタブメニュー */
    .nav-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 4px; border-bottom: 1px solid #eee; }
    .nav-tab { flex: 1; min-width: 70px; padding: 8px 4px; text-align: center; background: #eef2f5; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; color: #555; cursor: pointer; white-space: nowrap; }
    .nav-tab.active { background: #0056b3; color: #fff; }

    .calc-box { border: 2px solid #0056b3; border-radius: 10px; padding: 8px 12px; background: #f8fbff; }
    .calc-row { display: flex; justify-content: space-between; font-weight: bold; font-size: 13px; margin-bottom: 4px; }
    .progress-container { background: #e9ecef; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .progress-bar { background: #0056b3; height: 100%; width: 0%; transition: width 0.3s; }
    .progress-text { display: flex; justify-content: space-between; font-size: 11px; color: #666; margin-top: 4px; }

    /* 商品グリッド */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; max-width: 800px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #eee; }
    
    .img-box { width: 100%; height: 130px; background: #eef2f5; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 12px; cursor: pointer; overflow: hidden; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; }
    
    .card-info { padding: 8px; }
    .item-name { font-weight: bold; font-size: 13px; margin-bottom: 4px; color: #111; line-height: 1.2; height: 32px; overflow: hidden; }
    .item-sub { font-size: 11px; color: #666; margin-bottom: 6px; }
    .item-price { color: #0056b3; font-weight: bold; font-size: 14px; margin-bottom: 6px; }

    .counter { display: flex; align-items: center; border: 1px solid #ccc; border-radius: 6px; overflow: hidden; background: #f9f9f9; }
    .counter button { border: none; background: #e9ecef; width: 30px; height: 30px; font-size: 15px; font-weight: bold; cursor: pointer; color: #333; }
    .counter span { flex: 1; text-align: center; font-size: 13px; font-weight: bold; }

    /* 下部確定ボタン */
    .footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 10px 16px; box-shadow: 0 -2px 8px rgba(0,0,0,0.1); display: flex; justify-content: center; z-index: 100; }
    .submit-btn { width: 100%; max-width: 600px; padding: 12px; background: #0056b3; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; }
    .submit-btn:disabled { background: #ccc; cursor: not-allowed; }

    /* 画像拡大モーダル */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; }
    .modal img { max-width: 90%; max-height: 80%; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="header-title">商品一覧</div>
    
    <!-- カテゴリ選択タブ -->
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchCategory('魚')">魚</button>
      <button class="nav-tab" onclick="switchCategory('サンゴ')">サンゴ</button>
      <button class="nav-tab" onclick="switchCategory('イソギンチャク')">イソギンチャク</button>
      <button class="nav-tab" onclick="switchCategory('貝')">貝</button>
    </div>

    <div class="calc-box">
      <div class="calc-row">
        <span>合計金額: <span id="total-price">0</span> 円</span>
        <span>合計容積: <span id="total-vol">0</span> vol</span>
      </div>
      <div class="progress-container"><div class="progress-bar" id="p-bar"></div></div>
      <div class="progress-text">
        <span>箱の占有目安 (1000vol/箱)</span>
        <span><span id="box-ratio">0.0</span> 箱分 (<span id="box-pct">0</span>%)</span>
      </div>
    </div>
  </div>

  <div class="grid" id="product-grid">読み込み中...</div>

  <div class="footer-bar">
    <button class="submit-btn" id="submit-btn" disabled onclick="submitOrder()">注文を確定する (0点)</button>
  </div>

  <div class="modal" id="img-modal" onclick="closeModal()">
    <img id="modal-img" src="" alt="拡大画像">
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxRpRJxSVIVEphn7kndPs8YkVbJ_IeDBTecH00TduQxZzmd9x2mehloUEqaMdh7VDipyQ/exec";

    let allProducts = [];
    let currentCategory = '魚';
    let cart = {}; // IDごとの注文数 { "1": 2, "5": 1 }

    function formatImgUrl(url) {
      if (!url) return "";
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      return match && match[1] ? `https://lh3.googleusercontent.com/d/${match[1]}` : url;
    }

    async function loadProducts() {
      try {
        const res = await fetch(GAS_API_URL);
        const data = await res.json();
        
        // データの整形と数値型の保証
        allProducts = data.map(p => ({
          ...p,
          id: String(p.id),
          category: p.category ? String(p.category).trim() : '',
          price: Number(p.price) || 0,
          vol: Number(p.vol) || 0,
          stock: Number(p.stock) || 0
        }));

        console.log("読み込んだ商品データ:", allProducts);
        
        // カート初期化
        allProducts.forEach(p => {
          if (cart[p.id] === undefined) cart[p.id] = 0;
        });

        renderGrid();
      } catch (e) {
        console.error("データ読み込みエラー:", e);
        document.getElementById('product-grid').innerText = 'データ読み込みに失敗しました。';
      }
    }

    function switchCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.nav-tab').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.trim() === cat);
      });
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';

      const filtered = allProducts.filter(p => p.category === currentCategory);

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: span 2; text-align: center; padding: 20px; color: #888;">このカテゴリの商品はありません。</div>';
        return;
      }

      filtered.forEach(p => {
        const qty = cart[p.id] || 0;
        const card = document.createElement('div');
        card.className = 'card';
        
        const imgSrc = formatImgUrl(p.img);
        const imgHtml = imgSrc ? `<img src="${imgSrc}" alt="${p.name}">` : '画像なし';

        card.innerHTML = `
          <div class="img-box" onclick="openModal('${imgSrc}')">${imgHtml}</div>
          <div class="card-info">
            <div class="item-name">${p.name}</div>
            <div class="item-sub">サイズ:${p.size} / ${p.vol}vol / 在庫:${p.stock}</div>
            <div class="item-price">¥${p.price.toLocaleString()}</div>
            <div class="counter">
              <button onclick="updateQty('${p.id}', -1)">-</button>
              <span id="qty-${p.id}">${qty}</span>
              <button onclick="updateQty('${p.id}', 1)">+</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function updateQty(id, change) {
      const targetId = String(id);
      const item = allProducts.find(p => p.id === targetId);
      if (!item) return;

      let current = cart[targetId] || 0;
      let updated = current + change;

      if (updated < 0) updated = 0;
      if (updated > item.stock) {
        alert(`在庫数（${item.stock}個）を超えて注文することはできません。`);
        return;
      }

      cart[targetId] = updated;
      const el = document.getElementById(`qty-${targetId}`);
      if (el) el.innerText = updated;

      calculateTotal();
    }

    function calculateTotal() {
      let totalPrice = 0;
      let totalVol = 0;
      let totalItems = 0;

      allProducts.forEach(p => {
        const qty = cart[p.id] || 0;
        totalPrice += p.price * qty;
        totalVol += p.vol * qty;
        totalItems += qty;
      });

      document.getElementById('total-price').innerText = totalPrice.toLocaleString();
      document.getElementById('total-vol').innerText = totalVol.toLocaleString();

      const boxCount = (totalVol / 1000).toFixed(1);
      const boxPct = Math.round((totalVol % 1000) / 10);
      
      document.getElementById('box-ratio').innerText = boxCount;
      document.getElementById('box-pct').innerText = boxPct > 100 ? 100 : boxPct;
      document.getElementById('p-bar').style.width = `${boxPct > 100 ? 100 : boxPct}%`;

      const btn = document.getElementById('submit-btn');
      btn.innerText = `注文を確定する (${totalItems}点)`;
      btn.disabled = totalItems === 0;
    }

    async function submitOrder() {
      const orderItems = allProducts.filter(p => cart[p.id] > 0).map(p => ({
        id: p.id,
        category: p.category,
        name: p.name,
        price: p.price,
        vol: p.vol,
        qty: cart[p.id],
        subtotal: p.price * cart[p.id]
      }));

      if (orderItems.length === 0) return;

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = "在庫確認＆送信中...";

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({ items: orderItems })
        });
        
        const result = await res.json();

        if (result.status === "stock_error" || result.status === "error") {
          alert(result.message);
          location.reload();
          return;
        }

        // LINE用メッセージ生成（カテゴリ毎に表示）
        let totalVol = 0;
        let totalAmount = 0;
        let msg = "【ご注文内容】\n";
        
        orderItems.forEach(item => {
          msg += `・[${item.category}] ${item.name} × ${item.qty}（¥${item.subtotal.toLocaleString()}）\n`;
          totalAmount += item.subtotal;
          totalVol += item.vol * item.qty;
        });

        const boxCount = (totalVol / 1000).toFixed(1);

        msg += `\n合計金額: ¥${totalAmount.toLocaleString()}`;
        msg += `\n合計容積: ${totalVol.toLocaleString()} vol（約 ${boxCount} 箱分）`;

        const lineUrl = `https://line.me/R/share?text=${encodeURIComponent(msg)}`;
        window.location.href = lineUrl;

      } catch (e) {
        alert('注文処理中に通信エラーが発生しました。時間を置いて再度お試しください。');
        btn.disabled = false;
        calculateTotal();
      }
    }

    function openModal(src) {
      if (!src) return;
      document.getElementById('modal-img').src = src;
      document.getElementById('img-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('img-modal').style.display = 'none';
    }

    loadProducts();
  </script>
</body>
</html>
