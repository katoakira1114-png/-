<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>石垣島観賞魚 注文フォーム</title>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f4f8; color: #333; }

    /* ===== 上部固定ヘッダー ===== */
    .sticky-header-container {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    /* カテゴリタブ */
    .category-tabs {
      display: flex;
      overflow-x: auto;
      background: #1a73e8;
      padding: 8px 8px 0;
      gap: 4px;
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0;
      padding: 8px 16px;
      border: none;
      border-radius: 8px 8px 0 0;
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn.active { background: #fff; color: #1a73e8; font-weight: bold; }

    /* 合計・箱バー */
    .summary-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      flex-wrap: wrap;
      gap: 6px;
    }
    .summary-bar .total-display {
      font-size: 15px;
      font-weight: bold;
      color: #1a73e8;
    }
    .summary-bar .box-display {
      font-size: 13px;
      color: #555;
    }

    /* ===== メインコンテンツ ===== */
    .main-content { padding: 12px; }

    /* ユーザー情報バー */
    .user-info-bar {
      background: #e8f0fe;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #333;
    }
    .user-info-bar span { margin-right: 16px; }

    /* 商品カード */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }
    .product-card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }
    .product-card.out-of-stock { opacity: 0.5; }
    .product-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: #eee;
    }
    .product-card .card-body { padding: 8px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .product-card .card-name { font-size: 13px; font-weight: bold; line-height: 1.3; }
    .product-card .card-size { font-size: 11px; color: #777; }
    .product-card .card-price { font-size: 14px; color: #e53935; font-weight: bold; }
    .product-card .card-vol { font-size: 11px; color: #999; }
    .product-card .card-actions { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .product-card .qty-btn {
      width: 28px; height: 28px;
      border: 1px solid #ccc; border-radius: 50%;
      background: #fff; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .product-card .qty-input {
      width: 36px; text-align: center;
      border: 1px solid #ccc; border-radius: 4px;
      font-size: 14px; padding: 2px;
    }
    .product-card .add-btn {
      flex: 1; padding: 6px;
      background: #1a73e8; color: #fff;
      border: none; border-radius: 6px;
      font-size: 12px; cursor: pointer;
    }
    .product-card .add-btn:disabled { background: #aaa; cursor: not-allowed; }

    /* カート */
    .cart-section {
      margin-top: 20px;
      background: #fff;
      border-radius: 10px;
      padding: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .cart-section h2 { font-size: 16px; margin-bottom: 10px; color: #333; }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
    }
    .cart-item:last-child { border-bottom: none; }
    .cart-item .remove-btn {
      background: none; border: none; color: #e53935;
      font-size: 16px; cursor: pointer; padding: 0 6px;
    }

    /* 注文フォーム */
    .order-form {
      margin-top: 16px;
      background: #fff;
      border-radius: 10px;
      padding: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .order-form h2 { font-size: 16px; margin-bottom: 12px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 8px 10px;
      border: 1px solid #ccc; border-radius: 6px;
      font-size: 14px;
    }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .submit-btn {
      width: 100%; padding: 12px;
      background: #1a73e8; color: #fff;
      border: none; border-radius: 8px;
      font-size: 16px; font-weight: bold;
      cursor: pointer; margin-top: 8px;
    }
    .submit-btn:disabled { background: #aaa; cursor: not-allowed; }

    /* ローディング・エラー */
    .loading-overlay {
      position: fixed; inset: 0;
      background: rgba(255,255,255,0.9);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 999; font-size: 16px; color: #555;
      gap: 12px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-banner {
      background: #fdecea; border: 1px solid #e53935;
      border-radius: 8px; padding: 10px 14px;
      margin: 10px 0; font-size: 13px; color: #c62828;
    }
    .section-hidden { display: none; }

    /* 成功モーダル */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .modal-box {
      background: #fff; border-radius: 12px;
      padding: 24px; max-width: 320px; width: 90%;
      text-align: center;
    }
    .modal-box h3 { font-size: 18px; margin-bottom: 8px; color: #1a73e8; }
    .modal-box p { font-size: 14px; color: #555; margin-bottom: 16px; }
    .modal-box button {
      padding: 10px 24px; background: #1a73e8;
      color: #fff; border: none; border-radius: 8px;
      font-size: 15px; cursor: pointer;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- ローディング -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingText">初期化中...</div>
</div>

<!-- メインコンテンツ（ローディング後に表示） -->
<div id="appContent" class="hidden">

  <!-- 上部固定ヘッダー -->
  <div class="sticky-header-container">
    <div class="category-tabs" id="categoryTabs"></div>
    <div class="summary-bar">
      <div class="total-display" id="totalDisplay">合計: ¥0</div>
      <div class="box-display" id="boxDisplay">箱: 0L / 60L</div>
    </div>
  </div>

  <!-- メインコンテンツ -->
  <div class="main-content">

    <!-- ユーザー情報 -->
    <div class="user-info-bar" id="userInfoBar"></div>

    <!-- エラー表示 -->
    <div class="error-banner hidden" id="errorBanner"></div>

    <!-- 商品グリッド -->
    <div class="product-grid" id="productGrid"></div>

    <!-- カート -->
    <div class="cart-section" id="cartSection">
      <h2>🛒 カート</h2>
      <div id="cartItems"></div>
    </div>

    <!-- 注文フォーム -->
    <div class="order-form" id="orderForm">
      <h2>📋 注文情報</h2>
      <div class="form-group">
        <label>店舗名・お名前</label>
        <input type="text" id="inputStoreName" placeholder="例：〇〇水族館">
      </div>
      <div class="form-group">
        <label>電話番号</label>
        <input type="tel" id="inputPhone" placeholder="例：090-0000-0000">
      </div>
      <div class="form-group">
        <label>配送先住所</label>
        <input type="text" id="inputAddress" placeholder="例：沖縄県石垣市...">
      </div>
      <div class="form-group">
        <label>備考</label>
        <textarea id="inputNote" placeholder="ご要望・メモなど"></textarea>
      </div>
      <button class="submit-btn" id="submitBtn" disabled>注文する</button>
    </div>

  </div>
</div>

<!-- 成功モーダル -->
<div class="modal-overlay hidden" id="successModal">
  <div class="modal-box">
    <h3>✅ 注文完了</h3>
    <p id="successMessage">ご注文を受け付けました。<br>LINEに詳細を送信しました。</p>
    <button onclick="closeModal()">閉じる</button>
  </div>
</div>

<script>
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwEEEt2vWPC4BXlnj08pxvW6ARGKX4FVz41anHlh9wWaXmdduhz4Bb7YQsskkGHMwRz-A/exec";
const LIFF_ID = "2011653892-RjIQ6YBe";
const BOX_MAX_LITERS = 60;

let currentUserId = "";
let currentProfile = null;
let products = [];
let cart = [];
let currentCategory = "";

// ===== LIFF初期化 =====
async function initLIFF() {
  await liff.init({ liffId: LIFF_ID });

  if (!liff.isLoggedIn()) {
    liff.login();
    return; // リダイレクトが走るので以降は実行されない
  }

  try {
    const profile = await liff.getProfile();
    currentUserId = profile.userId;
    currentProfile = profile;
  } catch (err) {
    console.warn("プロフィール取得失敗:", err);
  }
}

// ===== 商品・顧客データ取得 =====
async function fetchData() {
  const url = GAS_API_URL + (currentUserId ? `?userId=${encodeURIComponent(currentUserId)}` : "");
  const res = await fetch(url);
  const json = await res.json();

  if (json.error) throw new Error(json.error);
  return json;
}

// ===== メイン起動処理 =====
window.addEventListener('DOMContentLoaded', async () => {
  const loadingText = document.getElementById("loadingText");

  try {
    // Step1: LIFF初期化（ログイン済みなら即完了、未ログインならリダイレクト）
    loadingText.textContent = "ログイン確認中...";
    await initLIFF();

    // Step2: データ取得
    loadingText.textContent = "データ読み込み中...";
    const data = await fetchData();

    // Step3: 画面構築
    buildUI(data);

  } catch (err) {
    console.error(err);
    showError("読み込みに失敗しました: " + err.message);
  } finally {
    document.getElementById("loadingOverlay").classList.add("hidden");
    document.getElementById("appContent").classList.remove("hidden");
  }
});

// ===== UI構築 =====
function buildUI(data) {
  products = data.products || [];

  if (!data.isRegistered) {
    showError("⚠️ 顧客マスタに未登録のアカウントです。管理者にお問い合わせください。");
  } else {
    // ユーザー情報表示
    const bar = document.getElementById("userInfoBar");
    bar.innerHTML = `<span>🏪 ${escHtml(data.storeName)}</span><span>📞 ${escHtml(data.phone)}</span><span>掛け率: ${data.discount * 100}%</span>`;

    // フォームに自動入力
    document.getElementById("inputStoreName").value = data.storeName || "";
    document.getElementById("inputPhone").value = data.phone || "";
    document.getElementById("inputAddress").value = data.address || "";
  }

  // カテゴリタブ生成
  const categories = [...new Set(products.map(p => p.category))];
  const tabsEl = document.getElementById("categoryTabs");
  categories.forEach((cat, i) => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (i === 0 ? " active" : "");
    btn.textContent = cat;
    btn.onclick = () => switchCategory(cat);
    tabsEl.appendChild(btn);
  });

  if (categories.length > 0) {
    switchCategory(categories[0]);
  }

  updateCartUI();
}

function switchCategory(cat) {
  currentCategory = cat;
  // タブ更新
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.classList.toggle("active", btn.textContent === cat);
  });
  renderProducts(cat);
}

function renderProducts(cat) {
  const grid = document.getElementById("productGrid");
  grid.innerHTML = "";

  const filtered = products.filter(p => p.category === cat);
  filtered.forEach(p => {
    const card = document.createElement("div");
    card.className = "product-card" + (!p.inStock ? " out-of-stock" : "");

    const priceText = p.price === "ASK" ? "ASK（要確認）" : `¥${p.price.toLocaleString()}`;

    card.innerHTML = `
      <img src="${escHtml(p.image)}" alt="${escHtml(p.name)}" onerror="this.src=''">
      <div class="card-body">
        <div class="card-name">${escHtml(p.name)}</div>
        <div class="card-size">${escHtml(p.size)}</div>
        <div class="card-price">${priceText}</div>
        <div class="card-vol">${escHtml(p.vol)}</div>
        <div class="card-actions">
          <button class="qty-btn" onclick="changeQty(this, -1)">－</button>
          <input class="qty-input" type="number" value="1" min="1" max="99">
          <button class="qty-btn" onclick="changeQty(this, 1)">＋</button>
          <button class="add-btn" onclick="addToCart(this, ${JSON.stringify(p).replace(/"/g, '&quot;')})"
            ${!p.inStock ? "disabled" : ""}>
            ${p.inStock ? "追加" : "在庫なし"}
          </button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function changeQty(btn, delta) {
  const actions = btn.closest(".card-actions");
  const input = actions.querySelector(".qty-input");
  const val = Math.max(1, Math.min(99, parseInt(input.value || "1") + delta));
  input.value = val;
}

function addToCart(btn, product) {
  const actions = btn.closest(".card-actions");
  const qty = parseInt(actions.querySelector(".qty-input").value || "1");

  const existing = cart.find(c => c.id === product.id);
  if (existing) {
    existing.qty += qty;
  } else {
    cart.push({ ...product, qty });
  }
  updateCartUI();
}

function removeFromCart(id) {
  cart = cart.filter(c => c.id !== id);
  updateCartUI();
}

function updateCartUI() {
  const cartItemsEl = document.getElementById("cartItems");
  cartItemsEl.innerHTML = "";

  let total = 0;
  let hasAsk = false;
  let totalVol = 0;

  cart.forEach(item => {
    const isAsk = item.price === "ASK";
    if (isAsk) {
      hasAsk = true;
    } else {
      total += item.price * item.qty;
    }

    // vol計算（数値として扱える場合のみ）
    const volNum = parseFloat(String(item.vol).replace(/[^0-9.]/g, ""));
    if (!isNaN(volNum)) totalVol += volNum * item.qty;

    const priceText = isAsk ? "ASK" : `¥${(item.price * item.qty).toLocaleString()}`;

    const row = document.createElement("div");
    row.className = "cart-item";
    row.innerHTML = `
      <span>${escHtml(item.name)} × ${item.qty}</span>
      <span>${priceText}</span>
      <button class="remove-btn" onclick="removeFromCart('${item.id}')">✕</button>
    `;
    cartItemsEl.appendChild(row);
  });

  // 合計表示
  let totalText = `¥${total.toLocaleString()}`;
  if (hasAsk) totalText += " + ASK";
  document.getElementById("totalDisplay").textContent = `合計: ${totalText}`;
  document.getElementById("boxDisplay").textContent = `箱: ${totalVol.toFixed(1)}L / ${BOX_MAX_LITERS}L`;

  // 注文ボタン
  document.getElementById("submitBtn").disabled = cart.length === 0;

  // カートが空なら表示を簡略化
  if (cart.length === 0) {
    cartItemsEl.innerHTML = '<p style="font-size:13px;color:#999;text-align:center;padding:8px;">カートは空です</p>';
  }
}

// ===== 注文送信 =====
document.getElementById("submitBtn").addEventListener("click", async () => {
  if (cart.length === 0) return;

  const storeName = document.getElementById("inputStoreName").value.trim();
  const phone = document.getElementById("inputPhone").value.trim();
  const address = document.getElementById("inputAddress").value.trim();
  const note = document.getElementById("inputNote").value.trim();

  if (!storeName) { alert("店舗名を入力してください"); return; }

  const totalEl = document.getElementById("totalDisplay").textContent.replace("合計: ", "");
  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = "送信中...";

  try {
    const payload = {
      userId: currentUserId,
      storeName, phone, address, note,
      items: cart,
      totalText: totalEl
    };

    const res = await fetch(GAS_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const result = await res.json();

    if (result.error) throw new Error(result.error);

    // LINEトークにも送信
    try {
      await liff.sendMessages([{
        type: "text",
        text: `【注文完了】\n店舗：${storeName}\n合計：${totalEl}\n商品：${cart.map(i => `${i.name}×${i.qty}`).join(", ")}`
      }]);
    } catch (lineErr) {
      console.warn("liff.sendMessages失敗:", lineErr);
      // フォールバック：公式LINEを開く
      try {
        await liff.openWindow({
          url: `https://line.me/R/oaMessage/%40877qwvyc/?text=${encodeURIComponent(`【注文完了】店舗：${storeName} 合計：${totalEl}`)}`,
          external: false
        });
      } catch (_) {}
    }

    cart = [];
    updateCartUI();
    document.getElementById("successMessage").innerHTML =
      `ご注文を受け付けました。<br>公式LINEあてに送信済みです。${result.pdfUrl ? `<br><a href="${result.pdfUrl}" target="_blank">📄 納品書</a>` : ""}`;
    document.getElementById("successModal").classList.remove("hidden");

  } catch (err) {
    alert("注文送信に失敗しました: " + err.message);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "注文する";
  }
});

function closeModal() {
  document.getElementById("successModal").classList.add("hidden");
}

function showError(msg) {
  const el = document.getElementById("errorBanner");
  el.textContent = msg;
  el.classList.remove("hidden");
}

function escHtml(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
</script>
</body>
</html>
