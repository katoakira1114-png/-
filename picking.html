<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
  <title>川畑水産 社内専用 ピッキング管理システム</title>
  <style>
    :root {
      --primary: #005bac;
      --primary-dark: #004380;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --warning: #d97706;
      --warning-bg: #fef3c7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 60px; line-height: 1.4; }


    /* ヘッダー */
    header {
      position: sticky; top: 0; z-index: 100;
      background-color: var(--primary);
      color: #fff;
      padding: 10px 14px;
      box-shadow: 0 2px 8px rgba(0, 91, 172, 0.25);
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .header-title { font-size: 1.02rem; font-weight: bold; display: flex; align-items: center; gap: 6px; }
    .admin-badge {
      font-size: 0.68rem; background: #ea580c; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: bold;
    }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .btn-header {
      background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.3);
      padding: 5px 9px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer;
      display: inline-flex; align-items: center; gap: 3px;
    }
    .btn-header:active { background: rgba(255,255,255,0.35); }
    .refresh-btn.spinning .spin-icon { animation: rotate 1s linear infinite; }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* ナビゲーションタブ */
    .nav-tabs {
      display: flex; gap: 6px; background: rgba(0,0,0,0.15); padding: 4px; border-radius: 8px;
    }
    .tab-btn {
      flex: 1; padding: 8px 10px; border: none; border-radius: 6px; font-size: 0.85rem; font-weight: bold;
      color: rgba(255,255,255,0.85); background: transparent; cursor: pointer; text-align: center;
      transition: all 0.15s ease;
    }
    .tab-btn.active { background: #fff; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

    /* 検索 & フィルターバー */
    .filter-bar {
      background: #fff; border-bottom: 1px solid var(--border); padding: 8px 12px;
      display: flex; gap: 8px; align-items: center; justify-content: space-between;
    }
    .search-input {
      flex: 1; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem;
    }
    .filter-select {
      padding: 7px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.82rem; background: #fff;
    }

    /* メインコンテナ */
    .container { max-width: 720px; margin: 10px auto; padding: 0 10px; }

    /* サマリーカード */
    .stats-card {
      background: #fff; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px;
      display: flex; justify-content: space-around; text-align: center; border: 1px solid var(--border);
    }
    .stat-val { font-size: 1.3rem; font-weight: bold; color: var(--primary); }
    .stat-label { font-size: 0.72rem; color: var(--text-muted); }

    /* 注文別ピッキングカード */
    .order-card {
      background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border);
      margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); overflow: hidden;
      transition: border-color 0.15s ease;
    }
    .order-card.shipped { opacity: 0.6; border-color: #cbd5e1; background: #f8fafc; }
    .order-card-header {
      padding: 10px 12px; display: flex; justify-content: space-between; align-items: flex-start;
      border-bottom: 1px solid #f1f5f9; background: #fff;
    }
    .order-card.shipped .order-card-header { background: #f1f5f9; }
    .order-cust-name { font-size: 1.05rem; font-weight: bold; color: #0f172a; }
    .order-meta-info { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    
    .status-badge {
      display: inline-block; padding: 3px 8px; border-radius: 20px; font-size: 0.72rem; font-weight: bold;
    }
    .status-badge.unshipped { background: var(--warning-bg); color: var(--warning); border: 1px solid #fde68a; }
    .status-badge.shipped { background: var(--success-bg); color: var(--success); border: 1px solid #bbf7d0; }

    /* 受取不可日・備考アラート */
    .ng-alert {
      background: var(--danger-bg); border-left: 4px solid var(--danger); color: #991b1b;
      padding: 6px 10px; font-size: 0.78rem; font-weight: bold; margin: 8px 12px 0 12px; border-radius: 4px;
    }
    .notes-alert {
      background: #f8fafc; border-left: 4px solid #64748b; color: #334155;
      padding: 6px 10px; font-size: 0.75rem; margin: 6px 12px 0 12px; border-radius: 4px;
    }

    /* 商品チェックリスト */
    .order-items-list { padding: 8px 12px; }
    .item-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 0; border-bottom: 1px dashed #e2e8f0; font-size: 0.92rem;
      cursor: pointer; user-select: none;
    }
    .item-row:last-child { border-bottom: none; }
    .item-left { display: flex; align-items: center; gap: 8px; flex: 1; }
    .item-check-icon {
      width: 22px; height: 22px; border-radius: 6px; border: 2px solid #cbd5e1;
      display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: transparent;
      transition: all 0.15s ease;
    }
    .item-row.checked .item-check-icon {
      background: var(--success); border-color: var(--success); color: #fff;
    }
    .item-row.checked .item-name {
      text-decoration: line-through; color: #94a3b8;
    }
    .item-category-tag {
      font-size: 0.68rem; background: #e2e8f0; color: #475569; padding: 2px 5px; border-radius: 4px; font-weight: bold;
    }
    .item-name { font-weight: bold; }
    .item-qty-badge {
      background: #eef6ff; color: var(--primary); padding: 3px 8px; border-radius: 6px;
      font-weight: bold; font-size: 0.9rem; border: 1px solid #bfdbfe; white-space: nowrap;
    }

    /* カードアクションボタン群 */
    .order-actions {
      padding: 10px 12px; background: #fafafa; border-top: 1px solid #f1f5f9;
      display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: flex-end;
    }
    .btn-action {
      padding: 7px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 4px; border: none;
    }
    .btn-ship-toggle {
      background: var(--success); color: #fff;
    }
    .btn-ship-toggle.is-shipped {
      background: #e2e8f0; color: #475569;
    }
    .btn-pdf { background: #f0f7ff; color: var(--primary); border: 1px solid #bfdbfe; }
    .btn-line { background: #06c755; color: #fff; }

    /* 合計ピッキング用スタイル */
    .category-section { margin-bottom: 14px; }
    .category-title {
      font-size: 0.95rem; font-weight: bold; color: var(--primary); padding: 6px 8px;
      background: #e0f2fe; border-left: 4px solid var(--primary); border-radius: 4px; margin-bottom: 6px;
    }
    .summary-item-card {
      background: #fff; border-radius: 8px; border: 1px solid var(--border); padding: 12px 14px;
      margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none; transition: all 0.15s ease;
    }
    .summary-item-card:active { transform: scale(0.99); background: #f8fafc; }
    .summary-item-card.picked {
      background: #f1f5f9; opacity: 0.6; border-color: #cbd5e1;
    }
    .summary-item-card.picked .summary-item-name {
      text-decoration: line-through; color: #94a3b8;
    }
    .summary-item-name { font-size: 1rem; font-weight: bold; }
    .summary-item-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    .summary-qty-box {
      background: #eff6ff; color: var(--primary); border: 2px solid #bfdbfe;
      border-radius: 8px; padding: 6px 12px; font-size: 1.15rem; font-weight: bold; text-align: center;
    }

    /* 空ステータス・ローディング */
    .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
    .empty-icon { font-size: 2.5rem; margin-bottom: 8px; }

    /* フッター */
    footer {
      position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
      border-top: 1px solid var(--border); padding: 8px 14px; font-size: 0.75rem;
      text-align: center; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center;
    }
    /* 生体追加トリガーボタン */
    .btn-add-item-trigger {
      width: 100%; margin-top: 10px; padding: 9px 12px;
      background: #f0f9ff; border: 1.5px dashed #0284c7; border-radius: 8px;
      color: #0369a1; font-size: 0.85rem; font-weight: bold; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-add-item-trigger:active { background: #e0f2fe; transform: scale(0.99); }

    /* モーダルスタイル */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6); z-index: 1000;
      display: flex; justify-content: center; align-items: flex-end;
      backdrop-filter: blur(2px);
    }
    @media (min-width: 640px) {
      .modal-overlay { align-items: center; padding: 20px; }
    }
    .modal-sheet {
      background: #fff; width: 100%; max-width: 500px;
      border-radius: 18px 18px 0 0; max-height: 90vh;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.2);
      animation: slideUp 0.2s ease-out;
    }
    @media (min-width: 640px) {
      .modal-sheet { border-radius: 16px; max-height: 85vh; }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-header {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      background: #f8fafc;
    }
    .modal-header-title { font-size: 1.05rem; font-weight: bold; color: var(--text); }
    .modal-header-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
    .modal-close-btn {
      background: none; border: none; font-size: 1.4rem; color: #94a3b8;
      cursor: pointer; padding: 4px 8px; line-height: 1; border-radius: 6px;
    }
    .modal-body {
      padding: 16px; overflow-y: auto; flex: 1;
      display: flex; flex-direction: column; gap: 14px;
    }
    .input-label { font-size: 0.82rem; font-weight: bold; color: #334155; margin-bottom: 5px; display: block; }
    .modal-search-input {
      width: 100%; padding: 11px 13px; font-size: 0.95rem; border: 2px solid #0284c7;
      border-radius: 8px; outline: none; background: #fff; box-sizing: border-box;
    }
    .modal-search-input:focus { box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
    .suggest-container {
      max-height: 240px; overflow-y: auto; border: 1px solid var(--border);
      border-radius: 8px; background: #fff;
    }
    .suggest-item {
      padding: 10px 12px; border-bottom: 1px solid #f1f5f9; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      transition: background 0.1s ease;
    }
    .suggest-item:active, .suggest-item:hover { background: #f0f9ff; }
    .suggest-item-name { font-size: 0.92rem; font-weight: bold; color: var(--text); }
    .suggest-item-badge {
      display: inline-block; font-size: 0.7rem; padding: 2px 6px;
      border-radius: 4px; background: #e0f2fe; color: #0369a1; font-weight: bold; margin-right: 4px;
    }
    .suggest-item-right { text-align: right; }
    .suggest-item-price { font-size: 0.9rem; font-weight: bold; color: var(--primary); }
    .suggest-item-stock { font-size: 0.75rem; color: #64748b; }
    .suggest-manual-item {
      padding: 12px 14px; background: #fffbeb; border-top: 2px dashed #f59e0b;
      cursor: pointer; display: flex; align-items: center; justify-content: space-between;
      color: #b45309; font-weight: bold; font-size: 0.88rem;
    }
    .suggest-manual-item:active { background: #fef3c7; }

    /* 確定商品の入力エリア */
    .confirmed-box {
      background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 10px;
      padding: 14px; display: flex; flex-direction: column; gap: 12px;
    }
    .confirmed-title-row {
      display: flex; justify-content: space-between; align-items: center;
    }
    .confirmed-badge {
      font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; font-weight: bold;
    }
    .confirmed-badge.master { background: #dcfce7; color: #15803d; }
    .confirmed-badge.manual { background: #fef3c7; color: #b45309; }
    .btn-reselect {
      font-size: 0.78rem; background: none; border: 1px solid #94a3b8;
      border-radius: 4px; padding: 3px 8px; color: #475569; cursor: pointer;
    }
    .qty-stepper {
      display: flex; align-items: center; gap: 8px;
    }
    .stepper-btn {
      width: 44px; height: 44px; border: 1px solid var(--border); background: #fff;
      border-radius: 8px; font-size: 1.3rem; font-weight: bold; cursor: pointer;
      display: flex; align-items: center; justify-content: center; color: var(--primary);
    }
    .stepper-btn:active { background: #f1f5f9; }
    .qty-input {
      flex: 1; height: 44px; text-align: center; font-size: 1.25rem; font-weight: bold;
      border: 1.5px solid var(--border); border-radius: 8px; outline: none;
    }
    .qty-input:focus { border-color: var(--primary); }
    .price-calc-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .calc-input-box { display: flex; flex-direction: column; }
    .calc-input {
      height: 42px; padding: 8px 10px; font-size: 1.05rem; font-weight: bold;
      border: 1.5px solid var(--border); border-radius: 8px; outline: none; text-align: right; box-sizing: border-box;
    }
    .calc-input:focus { border-color: var(--primary); }
    .modal-footer {
      padding: 12px 16px; border-top: 1px solid var(--border); background: #fff;
      display: flex; gap: 10px;
    }
    .btn-modal-cancel {
      flex: 1; padding: 12px; border: 1px solid var(--border); background: #f8fafc;
      border-radius: 8px; font-weight: bold; color: #64748b; cursor: pointer;
    }
    .btn-modal-submit {
      flex: 2; padding: 12px; border: none; background: var(--primary);
      border-radius: 8px; font-weight: bold; color: #fff; font-size: 0.95rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-modal-submit:active { opacity: 0.9; }
    .btn-modal-submit:disabled { background: #cbd5e1; cursor: not-allowed; }

    /* トースト通知 */
    .toast-notice {
      position: fixed; bottom: 65px; left: 50%; transform: translateX(-50%);
      background: #1e293b; color: #fff; padding: 10px 18px; border-radius: 30px;
      font-size: 0.85rem; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      z-index: 2000; display: none; align-items: center; gap: 6px; animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="header-title">
        <span>📦</span>
        <span>川畑水産 出荷ピッキング</span>
        <span class="admin-badge">社内専用</span>
      </div>
      <div class="header-actions">
        <a href="stock.html" class="btn-header" style="text-decoration:none;">🐠 在庫管理</a>
        <button class="btn-header refresh-btn" id="refresh-btn" onclick="fetchPickingData()">
          <span class="spin-icon">🔄</span>
          <span id="refresh-time-text">更新</span>
        </button>
      </div>
    </div>
    
    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-orders" onclick="switchTab('orders')">📦 店舗・注文別 (<span id="unshipped-order-count">0</span>)</button>
      <button class="tab-btn" id="tab-summary" onclick="switchTab('summary')">🐠 生体集約・合計 (<span id="total-specimen-count">0</span>)</button>
    </div>
  </header>

  <div class="filter-bar">
    <input type="text" class="search-input" id="search-input" placeholder="🔍 店舗名・生体名で検索..." oninput="handleSearch()">
    <select class="filter-select" id="status-filter" onchange="handleFilterChange()">
      <option value="unshipped">未発送のみ</option>
      <option value="all">すべて表示</option>
      <option value="shipped">発送済のみ</option>
    </select>
    <button type="button" class="btn-action" style="background:#0284c7; color:#fff; border:none; white-space:nowrap; padding:8px 12px; font-weight:bold; border-radius:6px;" onclick="openAddFishModal('NEW', '新規電話注文')">📞 新規注文</button>
  </div>

  <div class="container">
    <!-- 集計サマリー -->
    <div class="stats-card">
      <div>
        <div class="stat-val" id="stat-orders-val">0</div>
        <div class="stat-label">未出荷 注文数</div>
      </div>
      <div>
        <div class="stat-val" id="stat-items-val">0</div>
        <div class="stat-label">未出荷 合計点数</div>
      </div>
      <div>
        <div class="stat-val" id="stat-species-val">0</div>
        <div class="stat-label">対象 生体種数</div>
      </div>
    </div>

    <!-- ビュー1: 店舗・注文別ピッキング -->
    <div id="view-orders">
      <div id="orders-container">
        <div class="empty-state">
          <div class="empty-icon">⏳</div>
          <div>データを読み込んでいます...</div>
        </div>
      </div>
    </div>

    <!-- ビュー2: 生体・品目合計ピッキング -->
    <div id="view-summary" style="display: none;">
      <div id="summary-container">
        <div class="empty-state">
          <div class="empty-icon">⏳</div>
          <div>データを読み込んでいます...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 電話生体追加モーダル -->
  <div class="modal-overlay" id="add-fish-modal" style="display:none;" onclick="if(event.target===this) closeAddFishModal()">
    <div class="modal-sheet">
      <div class="modal-header">
        <div>
          <div class="modal-header-title">🐠 生体を手動追加</div>
          <div class="modal-header-sub" id="modal-target-order-label">対象: 注文番号</div>
        </div>
        <button class="modal-close-btn" onclick="closeAddFishModal()">✕</button>
      </div>

      <div class="modal-body">
        <!-- 新規電話注文時の顧客名入力（NEW時のみ表示） -->
        <div id="new-order-cust-section" style="display:none;">
          <label class="input-label">🏢 お客様名 / 店舗名 (必須)</label>
          <input type="text" id="new-order-cust-name" class="modal-search-input" placeholder="例: サンゴ堂 石垣店 様" style="margin-bottom:8px;">
          <label class="input-label">📞 お電話番号 (任意)</label>
          <input type="tel" id="new-order-cust-phone" class="modal-search-input" placeholder="例: 090-1234-5678" style="margin-bottom:12px;">
        </div>

        <!-- 検索入力 -->
        <div id="fish-search-section">
          <label class="input-label">1. 生体名・商品名を検索または手入力</label>
          <input type="text" id="add-fish-search" class="modal-search-input" placeholder="🔍 生体名を入力 (例: カクレクマノミ, スズメ...)" oninput="handleFishSearchInput()" autocomplete="off">
          <div id="fish-suggestions-box" class="suggest-container" style="margin-top:8px;"></div>
        </div>

        <!-- 確定・匹数・単価設定エリア -->
        <div id="add-fish-detail-area" style="display:none;">
          <div class="confirmed-box">
            <div class="confirmed-title-row">
              <span class="confirmed-badge" id="confirmed-badge">マスタ品</span>
              <button type="button" class="btn-reselect" onclick="reselectFish()">🔍 別の魚を再検索</button>
            </div>

            <!-- 商品名（マスタ品なら表示のみ、手入力なら編集可） -->
            <div>
              <label class="input-label" style="margin-bottom:3px;">商品名</label>
              <input type="text" id="confirmed-name-input" class="modal-search-input" style="padding:8px 10px; font-weight:bold;">
            </div>

            <!-- カテゴリ選択 -->
            <div>
              <label class="input-label" style="margin-bottom:3px;">カテゴリ</label>
              <select id="confirmed-category-select" class="filter-select" style="width:100%; height:38px;">
                <option value="魚">魚</option>
                <option value="シャコガイ">シャコガイ</option>
                <option value="貝">貝</option>
                <option value="サンゴ">サンゴ</option>
                <option value="イソギンチャク">イソギンチャク</option>
                <option value="擬岩">擬岩</option>
                <option value="その他">その他</option>
              </select>
            </div>

            <!-- 匹数(数量) -->
            <div>
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                <label class="input-label" style="margin-bottom:0;">2. 匹数 (数量)</label>
                <span id="stock-hint-label" style="font-size:0.75rem; color:#64748b;">在庫: -</span>
              </div>
              <div class="qty-stepper">
                <button type="button" class="stepper-btn" onclick="stepQty(-1)">−</button>
                <input type="number" id="confirmed-qty-input" class="qty-input" value="1" min="1" step="1" oninput="onQtyChanged()">
                <button type="button" class="stepper-btn" onclick="stepQty(1)">＋</button>
              </div>
              <div style="font-size:0.72rem; color:#64748b; margin-top:3px;">※ 在庫0以下でも追加可能です（電話営業・突発入荷に対応）</div>
            </div>

            <!-- 単価・合計金額 -->
            <div>
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                <label class="input-label" style="margin-bottom:0;">3. 単価 / 合計金額</label>
                <label style="font-size:0.78rem; display:flex; align-items:center; gap:4px; cursor:pointer;">
                  <input type="checkbox" id="confirmed-is-ask" onchange="onAskToggle()"> ASK (要問合せ)
                </label>
              </div>
              <div class="price-calc-grid" id="price-inputs-grid">
                <div class="calc-input-box">
                  <span style="font-size:0.72rem; color:#64748b; margin-bottom:2px;">1匹単価 (円)</span>
                  <input type="number" id="confirmed-unit-price" class="calc-input" placeholder="0" min="0" oninput="onUnitPriceChanged()">
                </div>
                <div class="calc-input-box">
                  <span style="font-size:0.72rem; color:#64748b; margin-bottom:2px;">合計金額 (円)</span>
                  <input type="number" id="confirmed-total-price" class="calc-input" placeholder="0" min="0" oninput="onTotalPriceChanged()">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-modal-cancel" onclick="closeAddFishModal()">キャンセル</button>
        <button type="button" class="btn-modal-submit" id="btn-submit-add-fish" onclick="submitAddFishItem()" disabled>
          <span>➕ 注文に追加する</span>
        </button>
      </div>
    </div>
  </div>

  <div class="toast-notice" id="toast-notice"></div>

  <footer>
    <span id="last-sync-label">社内出荷管理システム (60秒毎自動同期)</span>
    <a href="https://docs.google.com/spreadsheets/d/1ZiNel8TGJ-e7JMolkRagVOSnr1UczvQzpTa-F-s4p3o/edit" target="_blank" class="footer-link">📊 スプレッドシート</a>
  </footer>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxIYsPdreUjaOFutfshhQIwOLb_Ke1JprcDZj_LAT9oZnc-l-3jZLsPAsFd_QdQJAQ4eA/exec";
    const OFFICIAL_LINE_ID = "@721pyqfn";

    let currentTab = "orders";
    let rawOrders = [];
    let rawTotalSummary = [];
    let checkedItemsMap = {};
    let pickedSummaryMap = {};
    let allProductsMaster = [];
    let currentAddOrderId = "";
    let currentAddCustomerName = "";
    let selectedProductState = null;

    window.addEventListener('DOMContentLoaded', () => {
      try {
        checkedItemsMap = JSON.parse(localStorage.getItem('kawabata_picking_checks') || "{}");
        pickedSummaryMap = JSON.parse(localStorage.getItem('kawabata_summary_checks') || "{}");
      } catch (e) {}

      fetchPickingData();
      loadProductsMaster();

      // 60秒ごとに自動更新
      setInterval(fetchPickingData, 60000);
    });

    // タブ切り替え
    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-orders').classList.toggle('active', tab === 'orders');
      document.getElementById('tab-summary').classList.toggle('active', tab === 'summary');
      document.getElementById('view-orders').style.display = tab === 'orders' ? 'block' : 'none';
      document.getElementById('view-summary').style.display = tab === 'summary' ? 'block' : 'none';
      renderCurrentView();
    }

    // データ取得
    async function fetchPickingData() {
      const btn = document.getElementById('refresh-btn');
      btn.classList.add('spinning');

      try {
        const showAll = document.getElementById('status-filter').value !== 'unshipped' ? '1' : '0';
        const res = await fetch(`${GAS_API_URL}?action=getPickingList&showAll=${showAll}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const data = await res.json();
        if (data.status === 'success') {
          rawOrders = data.orders || [];
          rawTotalSummary = data.totalSummary || [];

          updateStats();
          renderCurrentView();

          const now = new Date();
          const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
          document.getElementById('refresh-time-text').innerText = timeStr;
        } else {
          console.error("API error:", data.message);
        }
      } catch (err) {
        console.error("fetchPickingData error:", err);
      } finally {
        btn.classList.remove('spinning');
      }
    }

    // 集計バッジ・数値の更新
    function updateStats() {
      const unshippedOrders = rawOrders.filter(o => !o.isShipped);
      let unshippedItemsCount = 0;
      let totalSpeciesCount = 0;

      unshippedOrders.forEach(o => {
        o.items.forEach(it => {
          if (!it.isShipped) unshippedItemsCount += it.qty;
        });
      });

      rawTotalSummary.forEach(sec => {
        totalSpeciesCount += sec.items.length;
      });

      document.getElementById('unshipped-order-count').innerText = unshippedOrders.length;
      document.getElementById('total-specimen-count').innerText = totalSpeciesCount;

      document.getElementById('stat-orders-val').innerText = unshippedOrders.length;
      document.getElementById('stat-items-val').innerText = unshippedItemsCount;
      document.getElementById('stat-species-val').innerText = totalSpeciesCount;
    }

    // 検索・フィルター処理
    function handleSearch() { renderCurrentView(); }
    function handleFilterChange() { fetchPickingData(); }

    function renderCurrentView() {
      if (currentTab === 'orders') {
        renderOrders();
      } else {
        renderSummary();
      }
    }

    // HTMLエスケープヘルパー
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 1. 店舗・注文別ピッキング一覧の描画
    function renderOrders() {
      const container = document.getElementById('orders-container');
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      const filter = document.getElementById('status-filter').value;

      let filtered = rawOrders.filter(o => {
        if (filter === 'unshipped' && o.isShipped) return false;
        if (filter === 'shipped' && !o.isShipped) return false;
        if (query) {
          const matchName = o.customerName.toLowerCase().includes(query);
          const matchId = o.orderId.toLowerCase().includes(query);
          const matchItem = o.items.some(it => it.name.toLowerCase().includes(query));
          return matchName || matchId || matchItem;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🎉</div>
            <div style="font-weight:bold; font-size:1.05rem;">未出荷の注文はありません</div>
            <div style="font-size:0.8rem; margin-top:4px;">すべての注文のピッキング・発送が完了しています！</div>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(order => {
        const isShipped = !!order.isShipped;
        const ngAlertHtml = order.ngDates ? `
          <div class="ng-alert">
            🚫 受取不可日（発送日注意）: ${escapeHtml(order.ngDates)}
          </div>
        ` : '';

        const notesAlertHtml = order.notes ? `
          <div class="notes-alert">
            📝 備考: ${escapeHtml(order.notes)}
          </div>
        ` : '';

        // アイテムリスト
        const itemsHtml = order.items.map((it, idx) => {
          const checkKey = `${order.orderId}_${idx}`;
          const isItemChecked = checkedItemsMap[checkKey] || isShipped;
          return `
            <div class="item-row ${isItemChecked ? 'checked' : ''}" onclick="toggleItemCheck('${escapeHtml(order.orderId)}', ${idx})">
              <div class="item-left">
                <div class="item-check-icon">✓</div>
                <span class="item-category-tag">${escapeHtml(it.category || '生体')}</span>
                <span class="item-name">${escapeHtml(it.name)}</span>
              </div>
              <div class="item-qty-badge">× ${it.qty}</div>
            </div>
          `;
        }).join('');

        // 発送通知LINE用リンク
        const shipMsg = `【発送完了のお知らせ】\n${order.customerName} 様\n\nご注文いただいた商品を本日発送いたしました。\n基本的には明日の午前中到着予定となります。\n到着後の水合わせ等のご準備をお願いいたします。\n\n📄納品書PDF:\n${order.pdfUrl || ''}`;
        const lineUrl = `https://line.me/R/oaMessage/${OFFICIAL_LINE_ID}/?${encodeURIComponent(shipMsg)}`;

        return `
          <div class="order-card ${isShipped ? 'shipped' : ''}" id="card-${escapeHtml(order.orderId)}">
            <div class="order-card-header">
              <div>
                <div class="order-cust-name">🏢 ${escapeHtml(order.customerName)} 様</div>
                <div class="order-meta-info">
                  ${escapeHtml(order.orderId)} | 📅 ${escapeHtml(order.orderDate)}
                  ${order.phone ? ` | 📞 <a href="tel:${escapeHtml(order.phone)}" style="color:#0284c7; text-decoration:none;">${escapeHtml(order.phone)}</a>` : ''}
                </div>
              </div>
              <div>
                <span class="status-badge ${isShipped ? 'shipped' : 'unshipped'}">
                  ${isShipped ? '✅ 発送済' : '⏳ 未発送'}
                </span>
              </div>
            </div>

            ${ngAlertHtml}
            ${notesAlertHtml}

            <div class="order-items-list">
              ${itemsHtml}
              <button type="button" class="btn-add-item-trigger" onclick="openAddFishModal('${escapeHtml(order.orderId)}', '${escapeHtml(order.customerName)}')">
                ➕ 生体を追加（電話追加など）
              </button>
            </div>

            <div class="order-actions">
              ${order.pdfUrl ? `<a href="${escapeHtml(order.pdfUrl)}" target="_blank" class="btn-action btn-pdf">📄 納品書</a>` : ''}
              <a href="${lineUrl}" class="btn-action btn-line">📤 発送LINE</a>
              <button class="btn-action btn-ship-toggle ${isShipped ? 'is-shipped' : ''}" onclick="toggleOrderStatus('${escapeHtml(order.orderId)}', ${!isShipped})">
                ${isShipped ? '↩ 未発送に戻す' : '📦 発送完了にする'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 2. 生体・品目合計ピッキング一覧の描画
    function renderSummary() {
      const container = document.getElementById('summary-container');
      const query = document.getElementById('search-input').value.trim().toLowerCase();

      if (rawTotalSummary.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🐠✨</div>
            <div style="font-weight:bold; font-size:1.05rem;">未出荷の生体はありません</div>
          </div>
        `;
        return;
      }

      let html = '';
      rawTotalSummary.forEach(sec => {
        let items = sec.items;
        if (query) {
          items = items.filter(it => it.name.toLowerCase().includes(query));
        }
        if (items.length === 0) return;

        html += `
          <div class="category-section">
            <div class="category-title">📂 ${escapeHtml(sec.category)} (${items.length}種)</div>
            ${items.map(it => {
              const pickKey = `${sec.category}_${it.name}`;
              const isPicked = !!pickedSummaryMap[pickKey];
              return `
                <div class="summary-item-card ${isPicked ? 'picked' : ''}" onclick="toggleSummaryPick('${escapeHtml(sec.category)}', '${escapeHtml(it.name)}')">
                  <div>
                    <div class="summary-item-name">${isPicked ? '✓ ' : ''}${escapeHtml(it.name)}</div>
                    <div class="summary-item-meta">${it.orderCount} 件の注文で必要</div>
                  </div>
                  <div class="summary-qty-box">
                    計 ${it.totalQty} 点
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      });

      container.innerHTML = html || '<div class="empty-state">検索に一致する商品はありません</div>';
    }

    // 各商品のタップ（チェック切り替え）
    function toggleItemCheck(orderId, itemIdx) {
      if (navigator.vibrate) navigator.vibrate(25);
      const key = `${orderId}_${itemIdx}`;
      checkedItemsMap[key] = !checkedItemsMap[key];
      try {
        localStorage.setItem('kawabata_picking_checks', JSON.stringify(checkedItemsMap));
      } catch (e) {}
      renderOrders();
    }

    // 生体集約のタップ（採取済み切り替え）
    function toggleSummaryPick(category, name) {
      if (navigator.vibrate) navigator.vibrate(25);
      const key = `${category}_${name}`;
      pickedSummaryMap[key] = !pickedSummaryMap[key];
      try {
        localStorage.setItem('kawabata_summary_checks', JSON.stringify(pickedSummaryMap));
      } catch (e) {}
      renderSummary();
    }

    // 注文単位の「発送完了にする / 未発送に戻す」
    async function toggleOrderStatus(orderId, setShipped) {
      if (navigator.vibrate) navigator.vibrate(40);
      
      const targetOrder = rawOrders.find(o => o.orderId === orderId);
      if (!targetOrder) return;

      // 楽観的UI更新
      targetOrder.isShipped = setShipped;
      targetOrder.items.forEach((it, idx) => {
        checkedItemsMap[`${orderId}_${idx}`] = setShipped;
      });
      renderOrders();
      updateStats();

      // GASバックエンドへ通信してスプレッドシートの発送済チェックを同期
      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: "updateShipStatus",
            orderId: orderId,
            isShipped: setShipped
          })
        });
        const result = await res.json();
        if (result.status !== 'success') {
          alert('更新エラー: ' + (result.message || ''));
          fetchPickingData();
        }
      } catch (err) {
        console.error("toggleOrderStatus error:", err);
        alert('通信エラーが発生しました。電波の良い場所で再度お試しください。');
        fetchPickingData();
      }
    }

    // ==========================================
    // 生体手動追加モーダル処理
    // ==========================================

    // マスタ商品データのバックグラウンド取得
    async function loadProductsMaster() {
      try {
        const res = await fetch(`${GAS_API_URL}?action=fetchProducts`);
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.products) {
          allProductsMaster = data.products;
        }
      } catch (e) {
        console.warn("loadProductsMaster error:", e);
      }
    }

    // モーダルを開く
    function openAddFishModal(orderId, customerName) {
      currentAddOrderId = orderId;
      currentAddCustomerName = customerName || "";
      
      const labelEl = document.getElementById('modal-target-order-label');
      const custSection = document.getElementById('new-order-cust-section');
      
      if (orderId === 'NEW') {
        labelEl.innerText = '📞 新規電話注文の作成';
        custSection.style.display = 'block';
        document.getElementById('new-order-cust-name').value = '';
        document.getElementById('new-order-cust-phone').value = '';
      } else {
        labelEl.innerText = `🏢 ${customerName} 様 (${orderId})`;
        custSection.style.display = 'none';
      }

      // 入力リセット
      selectedProductState = null;
      document.getElementById('add-fish-search').value = '';
      document.getElementById('fish-search-section').style.display = 'block';
      document.getElementById('add-fish-detail-area').style.display = 'none';
      document.getElementById('btn-submit-add-fish').disabled = true;

      handleFishSearchInput();

      document.getElementById('add-fish-modal').style.display = 'flex';
      setTimeout(() => {
        if (orderId === 'NEW') {
          document.getElementById('new-order-cust-name').focus();
        } else {
          document.getElementById('add-fish-search').focus();
        }
      }, 80);
    }

    // モーダルを閉じる
    function closeAddFishModal() {
      document.getElementById('add-fish-modal').style.display = 'none';
    }

    // 文字入力時の候補絞り込み（インクリメンタルサーチ）
    function handleFishSearchInput() {
      const query = (document.getElementById('add-fish-search').value || '').trim().toLowerCase();
      const box = document.getElementById('fish-suggestions-box');
      
      let matches = [];
      if (query) {
        matches = allProductsMaster.filter(p => {
          const pName = (p.name || '').toLowerCase();
          const pCat = (p.category || '').toLowerCase();
          const pSize = (p.size || '').toLowerCase();
          return pName.includes(query) || pCat.includes(query) || pSize.includes(query);
        }).slice(0, 25);
      } else {
        matches = allProductsMaster.slice(0, 15);
      }

      let html = '';
      matches.forEach(p => {
        const stockNum = p.stock !== undefined ? p.stock : 0;
        const stockStr = stockNum <= 0 ? `<span style="color:#ef4444; font-weight:bold;">在庫: ${stockNum} (0以下も追加可)</span>` : `在庫: ${stockNum}`;
        const priceStr = p.isAsk ? 'ASK' : `¥${(p.price || 0).toLocaleString()}`;
        const safeName = escapeHtml(p.name);
        const safeCat = escapeHtml(p.category || '魚');
        const safeSize = p.size ? ` (${escapeHtml(p.size)})` : '';
        
        html += `
          <div class="suggest-item" onclick="selectMasterFish('${escapeHtml(p.id)}')">
            <div>
              <div><span class="suggest-item-badge">${safeCat}</span><span class="suggest-item-name">${safeName}</span><span style="font-size:0.75rem; color:#64748b;">${safeSize}</span></div>
              <div class="suggest-item-meta">${stockStr}</div>
            </div>
            <div class="suggest-item-right">
              <div class="suggest-item-price">${priceStr}</div>
            </div>
          </div>
        `;
      });

      // 候補の一番下に「スプレッドシートに無い商品（直接手入力）」を配置
      const rawQuery = (document.getElementById('add-fish-search').value || '').trim();
      const manualLabel = rawQuery ? `「${escapeHtml(rawQuery)}」を直接手入力（未登録商品）` : 'スプレッドシートに無い商品を直接手入力';
      html += `
        <div class="suggest-manual-item" onclick="selectManualFish()">
          <span>➕ ${manualLabel}</span>
          <span style="font-size:0.75rem; color:#b45309;">タップして確定 →</span>
        </div>
      `;

      box.innerHTML = html;
    }

    // マスタ商品タップで確定
    function selectMasterFish(productId) {
      const p = allProductsMaster.find(item => String(item.id) === String(productId));
      if (!p) return;

      selectedProductState = {
        isManual: false,
        id: p.id,
        name: p.name,
        category: p.category || '魚',
        stock: p.stock || 0,
        price: p.price || 0,
        isAsk: !!p.isAsk,
        qty: 1
      };

      setupConfirmedView();
    }

    // マスタ外手入力タップで確定
    function selectManualFish() {
      const query = (document.getElementById('add-fish-search').value || '').trim();
      selectedProductState = {
        isManual: true,
        id: '',
        name: query || '',
        category: '魚',
        stock: 0,
        price: 0,
        isAsk: false,
        qty: 1
      };

      setupConfirmedView();
    }

    // 確定後の匹数・単価入力画面をセットアップ
    function setupConfirmedView() {
      document.getElementById('fish-search-section').style.display = 'none';
      document.getElementById('add-fish-detail-area').style.display = 'block';

      const badge = document.getElementById('confirmed-badge');
      const nameInput = document.getElementById('confirmed-name-input');
      const catSelect = document.getElementById('confirmed-category-select');
      const stockHint = document.getElementById('stock-hint-label');
      const qtyInput = document.getElementById('confirmed-qty-input');
      const unitPriceInput = document.getElementById('confirmed-unit-price');
      const totalPriceInput = document.getElementById('confirmed-total-price');
      const askCheckbox = document.getElementById('confirmed-is-ask');

      if (selectedProductState.isManual) {
        badge.className = 'confirmed-badge manual';
        badge.innerText = '✍️ 未登録・手入力';
        nameInput.readOnly = false;
        nameInput.value = selectedProductState.name;
        stockHint.innerText = 'マスタ外商品';
      } else {
        badge.className = 'confirmed-badge master';
        badge.innerText = '📋 マスタ登録品';
        nameInput.readOnly = true;
        nameInput.value = selectedProductState.name;
        stockHint.innerText = `現在庫: ${selectedProductState.stock} (在庫0以下でも追加可)`;
      }

      catSelect.value = selectedProductState.category || '魚';
      qtyInput.value = selectedProductState.qty || 1;
      askCheckbox.checked = selectedProductState.isAsk;

      if (selectedProductState.isAsk) {
        unitPriceInput.value = '';
        totalPriceInput.value = '';
        unitPriceInput.disabled = true;
        totalPriceInput.disabled = true;
      } else {
        unitPriceInput.disabled = false;
        totalPriceInput.disabled = false;
        unitPriceInput.value = selectedProductState.price || '';
        totalPriceInput.value = (selectedProductState.price * (selectedProductState.qty || 1)) || '';
      }

      document.getElementById('btn-submit-add-fish').disabled = false;
      setTimeout(() => {
        qtyInput.focus();
        qtyInput.select();
      }, 80);
    }

    // 別の魚を再検索
    function reselectFish() {
      document.getElementById('fish-search-section').style.display = 'block';
      document.getElementById('add-fish-detail-area').style.display = 'none';
      document.getElementById('btn-submit-add-fish').disabled = true;
      handleFishSearchInput();
      document.getElementById('add-fish-search').focus();
    }

    // 匹数の増減
    function stepQty(delta) {
      const input = document.getElementById('confirmed-qty-input');
      let val = parseInt(input.value, 10) || 1;
      val = Math.max(1, val + delta);
      input.value = val;
      onQtyChanged();
    }

    // 匹数変更時の再計算
    function onQtyChanged() {
      const qty = parseInt(document.getElementById('confirmed-qty-input').value, 10) || 1;
      if (selectedProductState) selectedProductState.qty = qty;

      const isAsk = document.getElementById('confirmed-is-ask').checked;
      if (!isAsk) {
        const unitPrice = parseFloat(document.getElementById('confirmed-unit-price').value) || 0;
        document.getElementById('confirmed-total-price').value = Math.round(unitPrice * qty);
      }
    }

    // 1匹単価入力時の合計金額自動計算
    function onUnitPriceChanged() {
      const qty = parseInt(document.getElementById('confirmed-qty-input').value, 10) || 1;
      const unitPrice = parseFloat(document.getElementById('confirmed-unit-price').value) || 0;
      document.getElementById('confirmed-total-price').value = Math.round(unitPrice * qty);
    }

    // 合計金額入力時の1匹単価自動計算
    function onTotalPriceChanged() {
      const qty = parseInt(document.getElementById('confirmed-qty-input').value, 10) || 1;
      const totalPrice = parseFloat(document.getElementById('confirmed-total-price').value) || 0;
      document.getElementById('confirmed-unit-price').value = qty > 0 ? Math.round(totalPrice / qty) : 0;
    }

    // ASK切り替え
    function onAskToggle() {
      const isAsk = document.getElementById('confirmed-is-ask').checked;
      const unitPriceInput = document.getElementById('confirmed-unit-price');
      const totalPriceInput = document.getElementById('confirmed-total-price');
      if (isAsk) {
        unitPriceInput.value = '';
        totalPriceInput.value = '';
        unitPriceInput.disabled = true;
        totalPriceInput.disabled = true;
      } else {
        unitPriceInput.disabled = false;
        totalPriceInput.disabled = false;
        const basePrice = selectedProductState ? selectedProductState.price : 0;
        const qty = parseInt(document.getElementById('confirmed-qty-input').value, 10) || 1;
        unitPriceInput.value = basePrice || '';
        totalPriceInput.value = (basePrice * qty) || '';
      }
    }

    // 確定・サーバー送信
    async function submitAddFishItem() {
      if (!selectedProductState) return;

      const nameInput = document.getElementById('confirmed-name-input');
      const finalName = nameInput.value.trim();
      if (!finalName) {
        alert('商品名を入力してください');
        nameInput.focus();
        return;
      }

      const catSelect = document.getElementById('confirmed-category-select');
      const finalCat = catSelect.value || '魚';
      const qtyInput = document.getElementById('confirmed-qty-input');
      const finalQty = parseInt(qtyInput.value, 10) || 1;
      if (finalQty <= 0) {
        alert('匹数は1以上を指定してください');
        qtyInput.focus();
        return;
      }

      const isAsk = document.getElementById('confirmed-is-ask').checked;
      let finalUnitPrice = 0;
      let finalTotalPrice = 0;
      if (!isAsk) {
        finalUnitPrice = parseFloat(document.getElementById('confirmed-unit-price').value) || 0;
        finalTotalPrice = parseFloat(document.getElementById('confirmed-total-price').value) || (finalUnitPrice * finalQty);
      }

      let payloadCustName = currentAddCustomerName;
      let payloadPhone = "";
      if (currentAddOrderId === 'NEW') {
        payloadCustName = (document.getElementById('new-order-cust-name').value || '').trim();
        payloadPhone = (document.getElementById('new-order-cust-phone').value || '').trim();
        if (!payloadCustName) {
          alert('お客様名 / 店舗名を入力してください');
          document.getElementById('new-order-cust-name').focus();
          return;
        }
      }

      const submitBtn = document.getElementById('btn-submit-add-fish');
      submitBtn.disabled = true;
      submitBtn.innerText = '追加処理中...';

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: "addOrderItem",
            orderId: currentAddOrderId,
            customerName: payloadCustName,
            phone: payloadPhone,
            item: {
              name: finalName,
              category: finalCat,
              qty: finalQty,
              price: finalUnitPrice,
              subtotal: finalTotalPrice,
              isAsk: isAsk
            }
          })
        });
        const result = await res.json();
        if (result.status === 'success') {
          if (navigator.vibrate) navigator.vibrate(50);
          closeAddFishModal();
          showToast(`✅ ${finalName} (${finalQty}匹) を追加しました！`);
          fetchPickingData();
        } else {
          alert('追加エラー: ' + (result.message || ''));
        }
      } catch (err) {
        console.error("submitAddFishItem error:", err);
        alert('通信エラーが発生しました。電波の良い場所で再度お試しください。');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '➕ 注文に追加する';
      }
    }

    // トースト通知の表示
    function showToast(msg) {
      const t = document.getElementById('toast-notice');
      if (!t) return;
      t.innerText = msg;
      t.style.display = 'flex';
      setTimeout(() => {
        t.style.display = 'none';
      }, 3500);
    }
  </script>
</body>
</html>
